<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Allocate Tee Times</title>
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/admin-button.css">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/admin-nav.css">
  <link rel="stylesheet" href="/css/admin-identity.css">
  
  <style>

    /* Reduce vertical space above page title */
    #admin-nav-container {
      margin-bottom: 4px !important;
    }

    #admin-identity-container {
      margin-bottom: 4px !important;
    }

    .tee-time-row {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
      align-items: center;
    }
    .tee-time-row input {
      width: 120px;
    }
    .container h2 {
        text-align: center;
    }
    .container {
        max-width: 1100px;
        margin: 10px auto !important;   /* was 40px */
        padding: 15px !important;       /* was 30px */
        text-align: center;
        background: white;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    
    .date-row {
      display: flex;
      flex-direction: column;
      align-items: center;     /* centers the whole block */
      gap: 8px;                /* spacing between the two rows */
    }

    /* Each label/value pair becomes a centered horizontal row */
    .date-row label,
    .date-row input,
    .date-row select {
      font-size: 16px;
    }

    .date-row .field-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

</style>

</head>

<body>
    <div id="admin-nav-container"></div>
    <div id="admin-identity-container"></div>

    <div class="container">

    <h2>Allocate Tee Times</h2>

    <!-- PLAY DATE INPUT -->
<div class="date-row">

    <div class="field-row">
        <label for="playDateInput">Play Date:</label>
        <input type="date" id="playDateInput">
    </div>

    <div class="field-row">
        <label for="firstNineSelect">First Nine:</label>
        <select id="firstNineSelect"></select>
    </div>

</div>

<div>
    <button id="loadBtn">Load</button>
</div>

    <hr>

    <!-- EXISTING TEE TIMES TABLE -->
    <div id="existingBlock" style="display:none;">
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Tee Time</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="teeTimesTableBody"></tbody>
      </table>

      <button id="editBlockBtn"><span>✏️</span>Edit Tee Times</button>
      <button id="deleteBlockBtn" class="danger"><span>🗑️</span> Delete All Tee Times</button>
    </div>

    <!-- GENERATE NEW BLOCK -->
    <div id="generateBlock" style="display:none;">
      <h3>Generate Tee Times</h3>

      <label>Starting Tee Time:</label>
      <input type="time" id="startTimeInput">

      <label style="margin-left:20px;">Number of Tee Times:</label>
      <input type="number" id="countInput" min="1" max="20">

      <button id="generateBtn">Generate</button>
    </div>

  <!-- EDIT / GENERATE MODAL -->
  <div id="teeTimesModal" class="modal-overlay" style="display:none;">
    <div class="modal-box">
      <h3>Edit Tee Times</h3>

      <div id="modalTeeTimes"></div>

      <div style="margin-top:20px;">
        <button id="saveModalBtn"><span>💾</span> Save</button>
        <button id="closeModalBtn" class="secondary">Cancel</button>
      </div>
    </div>
  </div>

  <script defer src="/js/admin-allocated-tee-times.js"></script>
</body>
</html>

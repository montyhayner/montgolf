<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two-Week Golfers Report</title>

  <!-- USER NAV + IDENTITY -->
  <link rel="stylesheet" href="/css/user-nav.css">
  <link rel="stylesheet" href="/css/user-identity.css">

  <style>
/* ============================================================
   TWO-COLUMN LAYOUT
   ============================================================ */
.reports-two-column {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  margin-top: 20px;
}

.left-report { flex: 2; }

.right-report {
  flex: 1;
  border-left: 2px solid #ddd;
  padding-left: 24px;
}

/* ============================================================
   ALLOCATED TEE TIMES BLOCKS
   ============================================================ */
.allocated-tee-times-row {
  display: flex;
  gap: 16px;
  flex-wrap: nowrap;
}

.tee-date-block {
  border: 1px solid #ccc;
  background: #fafafa;
  padding: 8px;
  width: 120px;
  text-align: center;
  border-radius: 4px;
}

.tee-date-header {
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
  margin-bottom: 6px;
  font-weight: bold;
}

.starting9 {
  border-bottom: 1px solid #ccc;
  padding: 4px 0;
  margin-bottom: 6px;
  font-weight: bold;
}

.tee-time {
  padding: 3px 0;
  border-bottom: 1px solid #eee;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1100px) {
  .reports-two-column { flex-direction: column; }
  .right-report {
    border-left: none;
    padding-left: 0;
    margin-top: 20px;
  }
}

/* ============================================================
   MODAL
   ============================================================ */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal.hidden { display: none; }

.modal-content {
  background: white;
  padding: 25px;
  border-radius: 8px;
  width: 420px;
  box-shadow: 0 0 12px rgba(0,0,0,0.2);
}

.recipient-section label {
  display: block;
  margin: 8px 0;
  font-size: 1rem;
}

.modal-buttons {
  margin-top: 20px;
  text-align: right;
}

.modal-buttons button {
  margin-left: 10px;
}

/* ============================================================
   REPORT LAYOUT
   ============================================================ */
.report-container { margin: 30px; }

.report-header {
  text-align: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid #ccc;
}

.report-header h1 { margin-bottom: 12px; }

.report-buttons {
  display: inline-flex;
  gap: 12px;
}

.report-buttons button {
  padding: 8px 14px;
  font-size: 14px;
}

.reports-single-column {
  max-width: 900px;
  margin: 0 auto;
  padding: 20px;
}

#user-golfers-container,
#user-tee-times-container {
  margin-bottom: 40px;
}

/* ============================================================
   TABLE
   ============================================================ */
#report-table-container {
  display: flex;
  justify-content: center;
}

.report-table {
  width: auto;
  max-width: 100%;
  margin: 0 auto;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 0.9rem;
}

.report-table th,
.report-table td {
  padding: 3px 4px;
  border: 1px solid #ccc;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 0.8rem;
  text-align: center;
}

.report-table th {
  background: #f4f4f4;
  font-weight: bold;
}

.totals-row td {
  background: #fafafa;
  font-weight: bold;
}

/* USER VERSION — Responsive Two-Column Layout */
.user-two-column {
  display: flex;
  justify-content: center;
  align-items: flex-start;
  gap: 32px;
  margin-top: 20px;
  flex-wrap: wrap; /* allows stacking when needed */
}

/* Left and right columns */
.user-left,
.user-right {
  flex: 1 1 420px; /* minimum width before stacking */
  max-width: 600px;
}

/* Center tables inside each column */
.user-left table,
.user-right table {
  margin-left: auto;
  margin-right: auto;
}

/* ============================================================
   PRINT VERSION
   ============================================================ */
/* When stacked vertically, reduce the vertical spacing */
@media (max-width: 1100px) {
  .user-two-column {
    flex-direction: column;
    align-items: center;
    gap: 12px;
    flex-wrap: nowrap;
  }

  .user-left,
  .user-right {
    flex: 0 1 auto;      /* <<< allows shrinking */
    width: 100%;         /* <<< forces full width when stacked */
    max-width: 900px;    /* <<< optional, keeps nice centering */
  }
}

@media print {
  nav,
  #btnEmailReport,
  #sendReportModal,
  .modal {
    display: none !important;
  }
}
  </style>

  <!-- UNIFIED JS -->
  <script defer src="/js/user-two-week-report.js"></script>
</head>

<body>

  <!-- Load User Nav -->
  <div id="nav-container"></div>
  <script>
    fetch("/partials/user-nav.html")
      .then(r => r.text())
      .then(html => document.getElementById("nav-container").innerHTML = html);
  </script>

  <div class="report-container">

    <div class="report-header">
      <h1>Two-Week Golfers Report</h1>

      <div class="report-buttons">
        <button id="btnEmailReport">Send Report</button>
        <button onclick="window.print()">Print Report</button>
      </div>
    </div>

    <div class="user-two-column">
      <div class="user-left" id="user-golfers-container"></div>
      <div class="user-right" id="user-tee-times-container"></div>
    </div>

    </div>
  </div>

  <!-- SEND REPORT MODAL -->
  <div id="sendReportModal" class="modal hidden">
    <div class="modal-content">

      <h2>Send Two‑Week Report</h2>

      <div class="recipient-section">

        <!-- ADMIN-ONLY OPTIONS (hidden for regular users) -->
        <div id="adminRecipientOptions" style="display:none">
          <label><input type="checkbox" id="chkSelectAll"> Select All</label>
          <label><input type="checkbox" id="chkPlayers"> Players in this report</label>
          <label><input type="checkbox" id="chkAdmins"> League admins</label>
          <label><input type="checkbox" id="chkStaff"> Club staff</label>
        </div>

        <!-- ALWAYS VISIBLE -->
        <label><input type="checkbox" id="chkSelf" checked disabled> Me (always included)</label>
        <label><input type="checkbox" id="chkSelfOnly"> Send to Myself Only</label>

      </div>

      <div class="modal-buttons">
        <button id="btnSendReport" class="primary">SEND</button>
        <button id="btnCancelSend" class="secondary">CANCEL</button>
      </div>

    </div>
  </div>

</body>
</html>

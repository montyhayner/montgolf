<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Available on Date</title>
  <link rel="stylesheet" href="/css/admin-nav.css">
  <link rel="stylesheet" href="/css/admin-identity.css">
  <link rel="stylesheet" href="/style.css">

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }

    h1 { margin-bottom: 20px; }

    .section {
      margin-top: 20px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fafafa;
      width: 500px;
    }

    select, input[type="date"], button {
      padding: 8px;
      margin-top: 10px;
      width: 100%;
    }

    button {
      background: #0275d8;
      color: white;
      cursor: pointer;
    }

    .results {
      margin-top: 25px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      width: 500px;
    }

    .player {
      padding: 6px 0;
      border-bottom: 1px solid #ddd;
    }

    .player:last-child {
      border-bottom: none;
    }
  </style>
</head>

<body>


    <div id="admin-nav-container"></div>
    <div id="admin-identity-container"></div>

    <div class="container">

        <!-- Loading message -->
        <div id="loading">Loading...</div>

  <!-- ADMIN NAV BAR -->
<div id="adminNav"></div>
<script>
  fetch("/partials/admin-nav.html")
    .then(r => r.text())
    .then(html => {
      document.getElementById("adminNav").innerHTML = html;
    });
</script>

  <h1>Who’s Available on a Specific Date</h1>

  <div class="section">
    <label for="leagueSelect"><strong>Select League:</strong></label>
    <select id="leagueSelect"></select>

    <label for="dateinput" style="margin-top:15px;"><strong>Select Date:</strong></label>
    <input type="date" id="dateInput">

    <button onclick="runReport()">Run Report</button>
  </div>

  <div id="results" class="results" style="display:none;">
    <h2>Eligible Players</h2>
    <div id="playersList"></div>
  </div>

  <script>

    function loadLeagues() {
      fetch('/api/leagues')
        .then(res => res.json())
        .then(data => {
          const select = document.getElementById("leagueSelect");
          select.innerHTML = "";

          data.forEach(l => {
            const opt = document.createElement("option");
            opt.value = l.id;
            opt.textContent = l.name;
            select.appendChild(opt);
          });
        });
    }

    function runReport() {
      const leagueId = document.getElementById("leagueSelect").value;
      const date = document.getElementById("dateInput").value;

      if (!leagueId || !date) {
        alert("Please select both a league and a date");
        return;
      }

      fetch(`/api/report/available-date/${leagueId}/${date}`)
        .then(res => res.json())
        .then(data => {
          const resultsDiv = document.getElementById("results");
          const list = document.getElementById("playersList");

          list.innerHTML = "";

          if (!data.eligible_players || data.eligible_players.length === 0) {
            list.innerHTML = "<p>No eligible players for this date.</p>";
          } else {
            data.eligible_players.forEach(p => {
              const div = document.createElement("div");
              div.className = "player";
              div.textContent = `${p.last_name}, ${p.first_name}`;
              list.appendChild(div);
            });
          }

          resultsDiv.style.display = "block";
        });
    }

async function initPage() {
    try {
        await loadAdminNav();
        const session = await loadSession();
        await loadAdminIdentity(session);
        loadLeagues();
    } catch (err) {
        console.error("Page initialization error:", err);
    }
}

    });

 </script>

  <script src="/js/admin-allocated-tee-times.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {
  const current = window.location.pathname;
  const links = document.querySelectorAll(".nav-links a");

  links.forEach(link => {
    if (link.getAttribute("href") === current) {
      link.classList.add("active");
    }
  });
});
</script>


    document.addEventListener("DOMContentLoaded", () => {
      initPage();   // loads nav + header
    });
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two-Week Golfers Report</title>

  <!-- ADMIN NAV + IDENTITY -->
  <link rel="stylesheet" href="/css/admin-nav.css">
  <link rel="stylesheet" href="/css/admin-identity.css">

  <style>
/* ============================================================
   TWO-COLUMN LAYOUT
   ============================================================ */
.reports-two-column {
  display: flex;
  gap: 32px;
  align-items: flex-start;
  margin-top: 20px;
}

.left-report { flex: 2; }

.right-report {
  flex: 1;
  border-left: 2px solid #ddd;
  padding-left: 24px;
}

/* ============================================================
   ALLOCATED TEE TIMES BLOCKS
   ============================================================ */
.allocated-tee-times-row {
  display: flex;
  gap: 16px;
  flex-wrap: nowrap;
}

.tee-date-block {
  border: 1px solid #ccc;
  background: #fafafa;
  padding: 8px;
  width: 120px;
  text-align: center;
  border-radius: 4px;
}

.tee-date-header {
  border-bottom: 1px solid #ccc;
  padding-bottom: 4px;
  margin-bottom: 6px;
  font-weight: bold;
}

.starting9 {
  border-bottom: 1px solid #ccc;
  padding: 4px 0;
  margin-bottom: 6px;
  font-weight: bold;
}

.tee-time {
  padding: 3px 0;
  border-bottom: 1px solid #eee;
}

/* ============================================================
   RESPONSIVE
   ============================================================ */
@media (max-width: 1100px) {
  .reports-two-column { flex-direction: column; }
  .right-report {
    border-left: none;
    padding-left: 0;
    margin-top: 20px;
  }
}

/* ============================================================
   MODAL
   ============================================================ */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.5);
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

.modal.hidden { display: none; }

.modal-content {
  background: white;
  padding: 25px;
  border-radius: 8px;
  width: 420px;
  box-shadow: 0 0 12px rgba(0,0,0,0.2);
}

.recipient-section label {
  display: block;
  margin: 8px 0;
  font-size: 1rem;
}

.modal-buttons {
  margin-top: 20px;
  text-align: right;
}

.modal-buttons button {
  margin-left: 10px;
}

/* ============================================================
   REPORT LAYOUT
   ============================================================ */

.report-container { margin: 30px; }

.report-header {
  text-align: center;
  margin-bottom: 10px;
  padding-bottom: 6px;
  border-bottom: 1px solid #ccc;
}

.report-header h1 { 
  text-align: center;
  margin-bottom: 12px; 
}

.report-buttons {
  display: inline-flex;
  gap: 12px;
}

.report-buttons button {
  padding: 8px 14px;
  font-size: 14px;
}

/* ============================================================
   TABLE
   ============================================================ */
#report-table-container {
  display: flex;
  justify-content: center;
}

.report-table {
  width: auto;
  max-width: 100%;
  margin: 0 auto;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 0.9rem;
}

.report-table th,
.report-table td {
  padding: 3px 4px;
  border: 1px solid #ccc;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  font-size: 0.8rem;
  text-align: center;
}

.report-table th {
  background: #f4f4f4;
  font-weight: bold;
}

.totals-row td {
  background: #fafafa;
  font-weight: bold;
}

/* ============================================================
   PRINT VERSION
   ============================================================ */
@media print {
  nav,
  #btnEmailReport,
  #sendReportModal,
  .modal {
    display: none !important;
  }

  .reports-two-column { display: block !important; }

  .left-report,
  .right-report {
    width: 100% !important;
    border: none !important;
    padding: 0 !important;
  }

  .right-report {
    margin-top: 40px;
    page-break-before: always;
  }
}
  </style>

  <!-- UNIFIED JS -->
  <script defer src="/js/two-week-report.js"></script>
</head>

<body>

  <!-- Load Admin Nav -->
  <!--<div id="nav-container"></div>
  <script>
    fetch("/partials/admin-nav.html")
      .then(r => r.text())
      .then(html => document.getElementById("nav-container").innerHTML = html);
  </script> -->

<div id="nav-container"></div>
<link id="nav-css" rel="stylesheet">

<script>
  async function loadNav() {
    try {
      const who = await fetch("/auth/whoami", { credentials: "include" });
      const user = await who.json();

      const isAdmin = user && user.is_admin === 1;

      const navFile = isAdmin
        ? "/partials/admin-nav.html"
        : "/partials/user-nav.html";

      const cssFile = isAdmin
        ? "/css/admin-nav.css"
        : "/css/user-nav.css";

      // Load CSS
      document.getElementById("nav-css").href = cssFile;

      // Load HTML
      const navHtml = await fetch(navFile).then(r => r.text());
      document.getElementById("nav-container").innerHTML = navHtml;

    } catch (err) {
      console.error("NAV LOAD ERROR:", err);

      // fallback: user nav + user CSS
      document.getElementById("nav-css").href = "/css/user-nav.css";

      fetch("/partials/user-nav.html")
        .then(r => r.text())
        .then(html => {
          document.getElementById("nav-container").innerHTML = html;
        });
    }
  }

  loadNav();
</script>

  <div class="report-container">

    <div class="report-header">
      <h1>Two-Week Golfers Report</h1>

      <div class="report-buttons">
        <button id="btnEmailReport">Send Report</button>
        <button onclick="window.print()">Print Report</button>
      </div>
    </div>

    <!-- TWO COLUMN LAYOUT -->
    <div class="reports-two-column">

      <!-- LEFT: MAIN REPORT -->
      <div class="left-report">
        <div id="report-table-container">
          <!-- JS injects the golfers table -->
        </div>
      </div>

      <!-- RIGHT: ALLOCATED TEE TIMES -->
      <div class="right-report">
        <div id="allocated-tee-times-container">
          <!-- JS injects tee time blocks -->
        </div>
      </div>

    </div>

  <!-- SEND REPORT MODAL -->
  <div id="sendReportModal" class="modal hidden">
    <div class="modal-content">

      <h2>Send Two‑Week Report</h2>

      <div class="recipient-section">

        <!-- ADMIN-ONLY OPTIONS (JS will show/hide this block) -->
        <div id="adminRecipientOptions">
          <label><input type="checkbox" id="chkSelectAll"> Select All</label>
          <label><input type="checkbox" id="chkPlayers"> Players in this report</label>
          <label><input type="checkbox" id="chkAdmins"> League admins</label>
          <label><input type="checkbox" id="chkStaff"> Club staff</label>
        </div>

        <!-- ALWAYS VISIBLE -->
        <label><input type="checkbox" id="chkSelf" checked disabled> Me (always included)</label>
        <label><input type="checkbox" id="chkSelfOnly"> Send to Myself Only</label>

      </div>

      <div class="modal-buttons">
        <button id="btnSendReport" class="primary">SEND</button>
        <button id="btnCancelSend" class="secondary">CANCEL</button>
      </div>

    </div>
  </div>

</body>
</html>

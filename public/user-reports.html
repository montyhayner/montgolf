<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Reports</title>
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/reports.css">
  <link id="nav-css" rel="stylesheet">
  <style>
        body {
      margin: 0;
      padding: 0;
    }
    h1, h2, h3 {
        margin-top: 0;
    }
    /* Page Header */
    #pageHeader {
        text-align: center;
        margin-left: auto;
        margin-right: auto;
        font-size: 20px;
        font-weight: bold;
        background-color: #f7f5bc;      
        color: #333;
        padding: 2px 0 4px 0;
        border-bottom: 1px solid #ddd;
        line-height: 1.2;
        margin-top: 0;
    }
    .container{
      text-align: center;
    }
  </style>
  <script defer src="/js/admin-reports.js"></script>
</head>
<body>

  <!-- Load User Nav -->
  <div id="nav-container"></div>

  <script src="/js/nav-loader.js"></script>

  <h1 id="pageHeader"></h1>
  
  <script>

    document.addEventListener("DOMContentLoaded", async () => {

      // Load user + league info and build header
      const [userInfo, leagueInfo] = await Promise.all([
        fetch("/user/info").then(r => r.json()),
        fetch("/user/selected-league").then(r => r.json())
      ]);
      const user = userInfo.user;
      const league = leagueInfo.league;
      const userName = `${user.first_name} ${user.last_name}`;
      const leagueName = league.league_name;
      document.getElementById("pageHeader").textContent =
      `Reports – ${userName} – ${leagueName}`;
    });
  </script>

  <div class="container" style="margin-top: 30px;">
    <h1>Reports</h1>

      <ul>
        <li><a href="/user-two-week-report.html">Two‑Week Golfers Report</a></li>
        <li><a href="/user-latest-tee-sheet.html">Latest Tee Sheet Report</a></li>
      </ul>
    
    <p>Planned reports:</p>
    <ul>
      <li>Two-week Golfers report</li>
      <li>Latest Tee Sheet report</li>
    </ul>
  </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Availability</title>

<div id="nav-container"></div>
<link id="nav-css" rel="stylesheet">
<link rel="stylesheet" href="/css/common.css">
<script src="/js/nav-loader.js"></script>

<style>

body {
  margin: 0;
  padding: 0;
}
h1, h2, h3 {
    margin-top: 0;
}
/* Page Header */
#pageHeader {
    text-align: center;
    margin-left: auto;
    margin-right: auto;
    font-size: 20px;
    font-weight: bold;
    background-color: #f7f5bc;      
    color: #333;
    padding: 2px 0 4px 0;
    border-bottom: 1px solid #ddd;
    line-height: 1.2;
    margin-top: 0;
}

  /* Status Banner (colors only — base lives in common.css) */
  .status-saved   { background: #d4edda; color: #155724; }
  .status-default { background: #fff3cd; color: #856404; }

  /* Toolbar */
  #availabilityToolbarWrapper {
    display: flex;
    justify-content: center;
    margin-top: 32px;
    margin-bottom: 36px;
  }

  #weeklyHeader {
    text-align: center;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 12px
  }

  #monthlyHeader {
    text-align: center;
    margin-left: auto;
    margin-right: auto;
    margin-bottom: 12px
  }

  #availabilityToolbar {
    display: flex;
    gap: 12px;
    align-items: center;
  }

  /* Save button (unique blue background) */
  #saveAvailabilityBtn {
    padding: 8px 22px;
    background: #007bff;
    color: white;
    font-size: 15px;
  }

  #saveAvailabilityBtn:hover:not(:disabled) {
    background: #0056b3;
    border-color: #003f7f;
  }

  /* Weekly Play Days */
  #playDaysContainer {
    margin-top: 20px;
    margin-bottom: 24px;
    display: flex;
    justify-content: center;   /* centers the row */
    gap: 10px;  
  }

  .day-toggle {
    display: inline-block;
    padding: 8px 12px;
    margin: 4px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    background: #f8f8f8;
    user-select: none;
  }

  .day-toggle.active {
    background: #4caf50;
    color: white;
    border-color: #4caf50;
  }

  .day-toggle.disabled-dow {
    background: #eee;
    color: #999;
    border: 1px solid #ccc;
    cursor: not-allowed;
  }

  .day-toggle.disabled-dow:hover {
    background: #e8e8e8;
  }

  /* Monthly Play Months */
#playMonthsContainer {
  margin-top: 20px;
  display: flex;
  justify-content: center;   /* center the whole row */
  gap: 10px;                 /* spacing between buttons */
  flex-wrap: nowrap;         /* keep all 12 on one line */
}

.month-toggle {
  padding: 10px 16px;        /* same as day-of-week buttons */
  border: 1px solid #aaa;
  border-radius: 6px;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
  text-align: center;
  min-width: 55px;           /* keeps them consistent */
}

  .month-toggle.out {
    background: #D21F3C;
    color: white;
    border-color: #cc00cc;
  }

  .month-toggle.in {
    background: #228b22;
    color: white;
    border-color: #28a428;
  }

.month-toggle:hover {
  filter: brightness(1.1);
}

@media (max-width: 600px) {
  .month-toggle {
    aspect-ratio: 1 / 1;      /* perfect squares on phones */
  }
}

/* Modal overlay */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
}

/* Modal content box */
.modal-content {
  background: white;
  padding: 20px 28px;
  border-radius: 8px;
  max-width: 420px;
  width: 90%;
  box-shadow: 0 4px 20px rgba(0,0,0,0.25);
  text-align: center;
}

/* Button row */
.modal-buttons {
  margin-top: 20px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

/* Button styles (match your existing theme) */
.modal-buttons .primary {
  background: #007bff;
  color: black;
  padding: 10px 18px;   /* Increase vertical height */
  font-size: 1rem;      /* Optional: slightly larger text */
  border-radius: 6px;   /* Optional: softer corners */
}

.modal-buttons .warning {
  background: #f0ad4e;
  color: black;
  padding: 10px 18px;   /* Increase vertical height */
  font-size: 1rem;      /* Optional: slightly larger text */
  border-radius: 6px;   /* Optional: softer corners */
}

.modal-buttons .secondary {
  background: #6c757d;
  color: black;
  padding: 10px 18px;   /* Increase vertical height */
  font-size: 1rem;      /* Optional: slightly larger text */
  border-radius: 6px;   /* Optional: softer corners */
}

</style></head>

<body>

<!-- Shared Nav Bar -->
<div id="nav-container"></div>
<link id="nav-css" rel="stylesheet">
<script src="/js/nav-loader.js"></script>

<h1 id="pageHeader"></h1>

<div id="statusBanner" class="status-banner"></div>

<!-- Toolbar -->
<div id="availabilityToolbarWrapper">
  <div id="availabilityToolbar">
    <button id="saveAvailabilityBtn" disabled>Save</button>
     <span id="savingIndicator" style="display:none; margin-left:10px; font-size:14px; color:#555;">
       Saving…
     </span>
    <button id="defaultAvailabilityBtn">Default</button>
    <button id="revertAvailabilityBtn">Revert</button>
    <div id="unsavedIndicator">• Unsaved changes</div>
  </div>
</div>

<h2 id="weeklyHeader">Weekly Play Days</h2>
<div id="playDaysContainer"></div>

<h2 id="monthlyHeader">Monthly In-Town Status</h2>
<div id="playMonthsContainer"></div>

<script>

let playDays = {};
let playMonths = {};
let savedPlayDays = {};
let savedPlayMonths = {};
let leaguePlayDays = [];
let leaguePlayMonths = [];
let unsavedChanges = false;
let unsavedModalCallbacks = {
  onSave: null,
  onContinue: null,
  onCancel: null
};

function showUnsavedChangesModal(callbacks) {
  unsavedModalCallbacks = callbacks;
  document.getElementById("unsavedModal").style.display = "flex";
}

function hideUnsavedChangesModal() {
  document.getElementById("unsavedModal").style.display = "none";
}


// ---- Shared Nav Loader + Highlight + Navigation Warning ----
document.addEventListener("DOMContentLoaded", async () => {

  setTimeout(() => {
    document.querySelectorAll(".nav-link").forEach(link => {
      link.addEventListener("click", (e) => {
        if (!unsavedChanges) return;

        e.preventDefault();

        requireNoUnsavedChanges({
          onSave: async () => {
            await document.getElementById("saveAvailabilityBtn").click();
            window.onbeforeunload = null;
            window.location = link.href;
          },
          onContinue: () => {
            window.onbeforeunload = null;
            window.location = link.href;
          },
          onCancel: () => {}
        });
      });
    });
  }, 200);


  document.getElementById("unsavedSave").addEventListener("click", async () => {
    hideUnsavedChangesModal();
    if (unsavedModalCallbacks.onSave) await unsavedModalCallbacks.onSave();
  });

  document.getElementById("unsavedContinue").addEventListener("click", () => {
    hideUnsavedChangesModal();
    if (unsavedModalCallbacks.onContinue) unsavedModalCallbacks.onContinue();
  });

  document.getElementById("unsavedCancel").addEventListener("click", () => {
    hideUnsavedChangesModal();
    if (unsavedModalCallbacks.onCancel) unsavedModalCallbacks.onCancel();
  });

  // Load user + league info and build header
   const [userInfo, leagueInfo] = await Promise.all([
     fetch("/user/info").then(r => r.json()),
     fetch("/user/selected-league").then(r => r.json())
  ]);
  const user = userInfo.user;
  const league = leagueInfo.league;
  const userName = `${user.first_name} ${user.last_name}`;
  const leagueName = league.league_name;
  document.getElementById("pageHeader").textContent =
  `My Availability – ${userName} – ${leagueName}`;

  // Initialize availability page AFTER nav loads
  initAvailabilityPage();
});

// ---- Helpers ----

function showSaving() {
  document.getElementById("savingIndicator").style.display = "inline";
}

function hideSaving() {
  document.getElementById("savingIndicator").style.display = "none";
}

function markUnsaved() {
  unsavedChanges = true;
  updateSaveButtonState();
  updateUnsavedIndicator();
}

function updateSaveButtonState() {
  document.getElementById("saveAvailabilityBtn").disabled = !unsavedChanges;
}

function updateUnsavedIndicator() {
  document.getElementById("unsavedIndicator").style.display =
    unsavedChanges ? "block" : "none";
}

function requireNoUnsavedChanges(callbacks) {
  if (!unsavedChanges) {
    callbacks.onContinue();
    return;
  }

  showUnsavedChangesModal(callbacks);
}

function restoreDefaultAvailability() {
  fetch("/user/availability/default", { method: "POST" })
    .then(res => res.json())
    .then(data => {
      playDays = data.playDays;
      playMonths = data.playMonths;
      renderPlayDays();
      renderPlayMonths();
      markUnsaved();
      updateStatusBanner("default");
    });
}

function revertAvailability() {
  playDays = JSON.parse(JSON.stringify(savedPlayDays));
  playMonths = JSON.parse(JSON.stringify(savedPlayMonths));

  renderPlayDays();
  renderPlayMonths();

  unsavedChanges = false;
  updateSaveButtonState();
  updateUnsavedIndicator();

  updateStatusBanner("reverted");
}


function normalizePlayMonths(obj) {
  const normalized = {};
  for (let m = 1; m <= 12; m++) {
    normalized[m] = !!obj[m];
  }
  return normalized;
}

function updateStatusBanner(type) {
  const banner = document.getElementById("statusBanner");
  banner.className = "status-banner";

  if (type === "saved") {
    banner.classList.add("status-saved");
    banner.textContent = "Availability saved.";
  } 
  else if (type === "default") {
    banner.classList.add("status-default");
    banner.textContent = "Default availability restored.";
  } 
  else if (type === "reverted") {
    banner.classList.add("status-saved");
    banner.textContent = "Back to last saved version.";
  } 
  else {
    banner.style.display = "none";
    return;
  }

  banner.style.display = "block";
}


// ---- Load Availability ----
async function initAvailabilityPage() {
  const res = await fetch("/user/availability");
  const data = await res.json();

  leaguePlayDays = data.leaguePlayDays;     // <-- ADD THIS
  leaguePlayMonths = data.leaguePlayMonths; // <-- ADD THIS

  playDays = data.playDays;
  playMonths = normalizePlayMonths(data.playMonths);

  savedPlayDays = JSON.parse(JSON.stringify(playDays));
  savedPlayMonths = JSON.parse(JSON.stringify(playMonths));

  unsavedChanges = false;
  updateSaveButtonState();
  updateUnsavedIndicator();

  renderPlayDays();
  renderPlayMonths();
}

// ---- Render Weekly Play Days ----

function renderPlayDays() {
  const container = document.getElementById("playDaysContainer");
  container.innerHTML = "";

  const names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  names.forEach((name, dow) => {
    const div = document.createElement("div");
    div.className = "day-toggle";

    if (playDays[dow]) div.classList.add("active");

    // If this DOW is invalid for the league
    if (!leaguePlayDays.includes(dow)) {
      div.classList.add("disabled-dow");
      div.setAttribute("data-tooltip", "League does not play on this day");
    }

    div.textContent = name;

    div.addEventListener("click", () => {

      // Always remove invalid red border on click
      div.classList.remove("invalid-dow");

      // If disabled, shake and exit
      if (div.classList.contains("disabled-dow")) {
        div.classList.add("shake");
        setTimeout(() => div.classList.remove("shake"), 250);
        return;
      }

      // Normal toggle logic
      playDays[dow] = !playDays[dow];
      div.classList.toggle("active");
      markUnsaved();
    });

    container.appendChild(div);
  });
}

// ---- Render Monthly In-Town Status ----

function renderPlayMonths() {
  const container = document.getElementById("playMonthsContainer");
  container.innerHTML = "";

  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  names.forEach((name, idx) => {
    const month = idx + 1;

    const div = document.createElement("div");
    div.className = "month-toggle";
    div.classList.add(playMonths[month] ? "in" : "out");

    div.textContent = name;

    div.addEventListener("click", () => {
      playMonths[month] = !playMonths[month];
      div.classList.toggle("in");
      div.classList.toggle("out");
      markUnsaved();
    });

    container.appendChild(div);
  });
}

// ---- Buttons ----
// --- SAVE ---
document.getElementById("saveAvailabilityBtn").addEventListener("click", async () => {
  showSaving();

  // ⭐ Force browser to repaint before fetch begins
  await new Promise(requestAnimationFrame);

  try {
    const res = await fetch("/user/availability", {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ playDays, playMonths })
    });

    const data = await res.json();

    // ❗ Backend rejected invalid DOW
    if (!res.ok || data.error) {
      updateStatusBanner("error", data.error || "Unable to save availability.");
      return;
    }

    // ✔ SUCCESS
    savedPlayDays = JSON.parse(JSON.stringify(playDays));
    savedPlayMonths = JSON.parse(JSON.stringify(playMonths));
    unsavedChanges = false;
    updateSaveButtonState();
    updateUnsavedIndicator();
    updateStatusBanner("saved");

  } catch (err) {
    console.error("Save availability failed:", err);
    updateStatusBanner("error", "Network or server error.");
  } finally {
    hideSaving();
  }
});

// DEFAULT

document.getElementById("defaultAvailabilityBtn").addEventListener("click", () => {
  requireNoUnsavedChanges({
    onSave: async () => {
      await document.getElementById("saveAvailabilityBtn").click();
      restoreDefaultAvailability();
      window.onbeforeunload = null;
    },
    onContinue: () => {
      restoreDefaultAvailability();
      window.onbeforeunload = null;
    },
    onCancel: () => {}
  });
});

document.getElementById("defaultAvailabilityBtn").addEventListener("click", () => {
  fetch("/user/availability/default", { method: "POST" })
    .then(res => res.json())
    .then(data => {
      playDays = data.playDays;
      playMonths = data.playMonths;
      renderPlayDays();
      renderPlayMonths();
      markUnsaved();
      updateStatusBanner("default");
    });
});

// REVERT
document.getElementById("revertAvailabilityBtn").addEventListener("click", () => {
  revertAvailability();
});

// ---- Leave Page Warning ----
window.onbeforeunload = (e) => {
  if (!unsavedChanges) return;
  e.preventDefault();
  e.returnValue = "";
};

</script>

<!-- Unsaved Changes Modal -->
<div id="unsavedModal" class="modal-overlay" style="display:none;">
  <div class="modal-content" style="max-width:420px;">
    <h2>Unsaved Changes</h2>
    <p>You have unsaved changes. What would you like to do?</p>

    <div class="modal-buttons">
      <button id="unsavedSave" class="primary">Save & Continue</button>
      <button id="unsavedContinue" class="warning">Continue Without Saving</button>
      <button id="unsavedCancel" class="secondary">Cancel</button>
    </div>
  </div>
</div>

</body>
</html>

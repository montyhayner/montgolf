<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Availability</title>

<link rel="stylesheet" href="/css/navbar.css">

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  h1 {
    margin-bottom: 8px;
  }

  /* Status Banner */
  .status-banner {
    padding: 6px 10px;
    margin-bottom: 8px;
    border-radius: 6px;
    font-size: 14px;
    font-weight: bold;
    display: none;
  }

  .status-saved { background: #d4edda; color: #155724; }
  .status-default { background: #fff3cd; color: #856404; }

  /* Toolbar */
  #availabilityToolbar {
    display: flex;
    gap: 10px;
    margin: 10px 0;
    padding: 8px 10px;
    background: #f8f9fb;
    border: 1px solid #c7c7c7;
    border-radius: 8px;
    align-items: center;
  }

  #availabilityToolbar button {
    padding: 6px 14px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #c7c7c7;
    background: #ffffff;
    cursor: pointer;
    transition: background 0.15s ease, border-color 0.15s ease, color 0.15s ease;
  }

  #availabilityToolbar button:hover:not(:disabled) {
    background: #d5e6ff;
    border-color: #2b7cff;
  }

  #availabilityToolbar button:disabled {
    opacity: 0.5;
    cursor: default;
  }

  #unsavedIndicator {
    color: #d9534f;
    font-weight: bold;
    display: none;
    margin-left: auto;
  }

  /* Play Days */
  #playDaysContainer {
    margin-top: 20px;
  }

  .day-toggle {
    display: inline-block;
    padding: 8px 12px;
    margin: 4px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    background: #f8f8f8;
    user-select: none;
  }

  .day-toggle.active {
    background: #4caf50;
    color: white;
    border-color: #4caf50;
  }

  /* Play Months */
  #playMonthsContainer {
    margin-top: 20px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
  }

  .month-toggle {
    padding: 8px;
    border: 1px solid #ccc;
    border-radius: 6px;
    cursor: pointer;
    text-align: center;
    background: #f8f8f8;
  }

  .month-toggle.out {
  background: #D21F3C;   /* Indian Red */
  color: white;
  border-color: #cc00cc;
  }

  .month-toggle.in {
  background: #228b22;   /*Bright Green */
  color: white;
  border-color: #28a428;

  }
</style>
</head>

<body>

<!-- Shared Nav Bar -->
<div id="navContainer"></div>

<h1>
  My Schedule
  <span id="leagueNameHeader"></span>
  <span id="userNameHeader"></span>
</h1>

<div id="statusBanner" class="status-banner"></div>

<!-- Toolbar -->

<div id="availabilityToolbar">
  <h1>My Availability <span id="leagueNameHeader"></span></h1>
  <button id="defaultBtn">Default</button>
  <button id="saveBtn" disabled>Save</button>
  <button id="revertBtn">Revert</button>
  <div id="unsavedIndicator">• Unsaved changes</div>
</div>

<h2>Weekly Play Days</h2>
<div id="playDaysContainer"></div>

<h2>Monthly In-Town Status</h2>
<div id="playMonthsContainer"></div>

<script>
let playDays = {};
let playMonths = {};
let savedPlayDays = {};
let savedPlayMonths = {};
let unsavedChanges = false;

// ---- Shared Nav Loader ----
document.addEventListener("DOMContentLoaded", () => {
  fetch("/partials/user-nav")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navContainer").innerHTML = html;

      // Highlight active link
      const path = window.location.pathname;
      document.querySelectorAll("#topNav .nav-link").forEach(link => {
        if (link.getAttribute("href") === path) {
          link.classList.add("active");
        }
      });

      // Navigation warning
      document.querySelectorAll("#topNav a").forEach(link => {
        link.addEventListener("click", (e) => {
          if (!unsavedChanges) return;
          const leave = confirm("You have unsaved changes. Save before leaving?");
          if (!leave) e.preventDefault();
        });
      });
    });

  initAvailabilityPage();
});

// ---- Helpers ----

function markUnsaved() {
  unsavedChanges = true;
  updateSaveButtonState();
  updateUnsavedIndicator();
}

function updateSaveButtonState() {
  document.getElementById("saveBtn").disabled = !unsavedChanges;
}

function updateUnsavedIndicator() {
  document.getElementById("unsavedIndicator").style.display =
    unsavedChanges ? "block" : "none";
}

function updateStatusBanner(type) {
  const banner = document.getElementById("statusBanner");
  banner.className = "status-banner";

  if (type === "saved") {
    banner.classList.add("status-saved");
    banner.textContent = "Availability saved.";
  } else if (type === "default") {
    banner.classList.add("status-default");
    banner.textContent = "Default availability restored.";
  } else {
    banner.style.display = "none";
    return;
  }

  banner.style.display = "block";
}

// ---- Load Availability ----

async function initAvailabilityPage() {
  const res = await fetch("/user/availability");
  const data = await res.json();

  playDays = data.playDays;
  playMonths = data.playMonths;

  savedPlayDays = JSON.parse(JSON.stringify(playDays));
  savedPlayMonths = JSON.parse(JSON.stringify(playMonths));

  unsavedChanges = false;
  updateSaveButtonState();
  updateUnsavedIndicator();

  renderPlayDays();
  renderPlayMonths();
}

// ---- Render Weekly Play Days ----

function renderPlayDays() {
  const container = document.getElementById("playDaysContainer");
  container.innerHTML = "";

  const names = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

  names.forEach((name, dow) => {
    const div = document.createElement("div");
    div.className = "day-toggle";
    if (playDays[dow]) div.classList.add("active");

    div.textContent = name;

    div.addEventListener("click", () => {
      playDays[dow] = !playDays[dow];
      div.classList.toggle("active");
      markUnsaved();
    });

    container.appendChild(div);
  });
}

// ---- Render Monthly In-Town Status ----

function renderPlayMonths() {
  const container = document.getElementById("playMonthsContainer");
  container.innerHTML = "";

  const names = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

  names.forEach((name, idx) => {
    const month = idx + 1;

    const div = document.createElement("div");
    div.className = "month-toggle";
    div.classList.add(playMonths[month] ? "in" : "out");

    div.textContent = name;

    div.addEventListener("click", () => {
      playMonths[month] = !playMonths[month];
      div.classList.toggle("in");
      div.classList.toggle("out");
      markUnsaved();
    });

    container.appendChild(div);
  });
}

// ---- Buttons ----

// SAVE
document.getElementById("saveBtn").addEventListener("click", () => {
  fetch("/user/availability", {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ playDays, playMonths })
  })
  .then(() => {
    savedPlayDays = JSON.parse(JSON.stringify(playDays));
    savedPlayMonths = JSON.parse(JSON.stringify(playMonths));
    unsavedChanges = false;
    updateSaveButtonState();
    updateUnsavedIndicator();
    updateStatusBanner("saved");
  });
});

// DEFAULT
document.getElementById("defaultBtn").addEventListener("click", () => {
  fetch("/user/availability/default", { method: "POST" })
    .then(res => res.json())
    .then(data => {
      playDays = data.playDays;
      playMonths = data.playMonths;
      renderPlayDays();
      renderPlayMonths();
      markUnsaved();
      updateStatusBanner("default");
    });
});

// REVERT
document.getElementById("revertBtn").addEventListener("click", () => {
  playDays = JSON.parse(JSON.stringify(savedPlayDays));
  playMonths = JSON.parse(JSON.stringify(savedPlayMonths));
  renderPlayDays();
  renderPlayMonths();
  unsavedChanges = false;
  updateSaveButtonState();
  updateUnsavedIndicator();
  updateStatusBanner("saved");
});

document.addEventListener("DOMContentLoaded", () => {
  // Load nav bar
  fetch("/partials/user-nav")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navContainer").innerHTML = html;
    });

  // Load league name for page header
  fetch("/user/selected-league")
    .then(r => r.json())
    .then(data => {
      if (data.league) {
        document.getElementById("leagueNameHeader").textContent =
          "— " + data.league.league_name;
      }
    });

  // Load user name for page header
  fetch("/user/info")
    .then(r => r.json())
    .then(data => {
      if (data.user) {
        document.getElementById("userNameHeader").textContent =
          " — " + data.user.first_name + " " + data.user.last_name;
      }
    });
});

// ---- Leave Page Warning ----

window.addEventListener("beforeunload", (e) => {
  if (!unsavedChanges) return;
  e.preventDefault();
  e.returnValue = "";
});
</script>

</body>
</html>

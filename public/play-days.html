<!DOCTYPE html>
<html>
<head>
  <title>My Play Days</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }

    /* USER NAV BAR */
    .user-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #004b8d;
      padding: 12px 20px;
      border-radius: 6px;
      margin-bottom: 25px;
    }
    .user-nav .nav-title {
      color: #fff;
      font-size: 20px;
      font-weight: bold;
    }
    .user-nav a {
      color: #e6e6e6;
      text-decoration: none;
      margin-left: 18px;
      font-size: 15px;
      transition: color 0.2s ease;
    }
    .user-nav a:hover {
      color: #ffffff;
    }
    .user-nav .logout-link {
      color: #ff6b6b;
    }
    .user-nav .logout-link:hover {
      color: #ff9b9b;
    }

    h2 {
      margin-bottom: 10px;
    }

    .days-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 12px;
      max-width: 700px;
      margin-top: 20px;
    }

    .day-box {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
      cursor: pointer;
      background: #f8f8f8;
      transition: background 0.2s ease;
      user-select: none;
    }

    .day-box.active {
      background: #4caf50;
      color: white;
      border-color: #3e8e41;
    }

    #saveBtn {
      margin-top: 25px;
      padding: 10px 20px;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
    }

    #saveBtn:hover {
      background: #0056b3;
    }
  </style>
</head>

<body>

  <!-- USER NAV BAR -->
  <div class="user-nav">
    <div class="nav-left">
      <span class="nav-title">Golf Scheduler</span>
    </div>
    <div class="nav-right">
      <a href="schedule.html">My Schedule</a>
      <a href="play-months.html">Play Months</a>
      <a href="play-days.html">Play Days</a>
      <a href="/logout" class="logout-link">Logout</a>
    </div>
  </div>

  <h2>My Play Days</h2>

  <div class="days-grid" id="daysGrid"></div>

  <button id="saveBtn" onclick="saveDays()">Save</button>

  <script>
    const dayCodes = ["M","T","W","R","F","S","U"];
    const dayLabels = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

    let userPlayDays = "";

    async function loadDays() {
      const res = await fetch("/api/user/playdays");
      const data = await res.json();
      userPlayDays = data.play_days || "";
      renderDays();
    }

    function renderDays() {
      const grid = document.getElementById("daysGrid");
      grid.innerHTML = "";

      dayCodes.forEach((code, i) => {
        const div = document.createElement("div");
        div.className = "day-box";
        div.textContent = dayLabels[i];

        if (userPlayDays.includes(code)) {
          div.classList.add("active");
        }

        div.onclick = () => {
          div.classList.toggle("active");

          if (div.classList.contains("active")) {
            userPlayDays += code;
          } else {
            userPlayDays = userPlayDays.replace(code, "");
          }
        };

        grid.appendChild(div);
      });
    }

    async function saveDays() {
      await fetch("/api/user/playdays", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ play_days: userPlayDays })
      });

      alert("Your play days have been updated.");
    }

    loadDays();
  </script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Login</title>

<link rel="stylesheet" href="/css/admin.css">

<style>
  body {
    font-family: Arial, sans-serif;
    padding: 20px;
  }

  .login-box {
    margin: 60px auto;
    width: 320px;
    padding: 20px;
    border: 1px solid #ccc;
    border-radius: 8px;
    background: #f8f9fb;
  }

  h1 {
    text-align: center;
    margin-bottom: 20px;
  }

  input[type="text"],
  input[type="password"] {
    width: 100%;
    padding: 8px;
    margin: 6px 0 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
  }

  button {
    width: 100%;
    padding: 10px;
    background: #0275d8;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }

  button:hover {
    background: #025bb5;
  }

  .error-box {
    color: #d9534f;
    margin-bottom: 10px;
    text-align: center;
    display: none; /* hidden by default */
  }

  .forgot-link {
    text-align: center;
    margin-top: 10px;
  }

  .forgot-link a {
    color: #0275d8;
    text-decoration: none;
  }
</style>
</head>

<body>

<!-- CORRECT NAV BAR CONTAINER -->
<div id="admin-login-nav"></div>

<script>
  fetch("partials/admin-login-nav.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("admin-login-nav").innerHTML = html;
    });
</script>

<div class="login-box">
  <h1>Admin Login</h1>

  <!-- ERROR BOX -->
  <div id="errorBox" class="error-box">
    Invalid Email or Password.
  </div>

  <form method="POST" action="/admin-login">
    <input type="text" name="email" placeholder="Admin Email" autocomplete="email" required>

    <input id="passwordField" type="password" name="password"
           placeholder="Password" autocomplete="current-password" required>

    <button type="submit">Log In</button>
  </form>

  <div class="forgot-link">
    <a href="/admin-forgot-password">Forgot Password?</a>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  if (params.get("error") === "1") {
      document.getElementById("errorBox").style.display = "block";
  }
</script>

</body>
</html>

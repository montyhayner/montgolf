<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Latest Tee Sheet Report</title>

  <!-- USER CSS -->
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/reports.css">
  <link rel="stylesheet" href="/css/user-identity.css">
  
  <style>
    #pageHeader {
      text-align: center;
      margin-left: auto;
      margin-right: auto;
      font-size: 20px;
      font-weight: bold;
      color: #333;
      padding: 2px 0 4px 0;
      border-bottom: 1px solid #ddd;
      line-height: 1.2;
      margin-top: 0;
    }
  </style>
</head>

<body>

  <!-- USER NAV BAR -->
  <div id="user-nav-container"></div>

  <!-- USER IDENTITY BAR -->
  <div id="user-identity-container"></div>

  <!-- PAGE HEADER -->
  <h1 id="pageHeader"></h1>

  <!-- REPORT CONTENT -->
  <div class="page">
    <table id="teeSheetTable" class="report-table">
      <thead>
        <tr>
          <th>Tee Time</th>
          <th>Nine</th>
          <th>Players</th>
        </tr>
      </thead>
      <tbody id="teeSheetBody"></tbody>
    </table>

    <div class="button-row">
      <button id="btnPrintLatest" class="secondary-action-btn">Print Report</button>
      <button id="btnSendLatest" class="primary-action-btn">Send Report</button>
    </div>
  </div>

  <!-- PAGE HEADER SCRIPT -->
  <script src="/js/page-header.js"></script>

  <!-- Tee sheet HTML builder -->
  <script src="/js/build-tee-sheet-HTML.js"></script>

  <!-- USER VERSION MAIN LOGIC -->
  <script src="/js/user-latest-tee-sheet.js"></script>

</body>
</html>

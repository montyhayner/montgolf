<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Schedule</title>
<link rel="stylesheet" href="/css/navbar.css">
<link rel="stylesheet" href="/css/common.css">

<style>

body {
  margin: 0;
  padding: 0;
}
h1, h2, h3 {
    margin-top: 0;
}
/* Page Header */
#pageHeader {
    text-align: center;
    margin-left: auto;
    margin-right: auto;
    font-size: 20px;
    font-weight: bold;
    background-color: #f7f5bc;      
    color: #333;
    padding: 2px 0 4px 0;
    border-bottom: 1px solid #ddd;
    line-height: 1.2;
    margin-top: 0;
}  
/* ------------------------------------------------------------
   GLOBAL CENTERING FOR SCHEDULE PAGE
------------------------------------------------------------ */
#statusBanner,
#scheduleToolbar,
#calendarContainer {
  margin-left: auto;
  margin-right: auto;
  text-align: center;
  width: 100%;
}

/* Centers the banner wrapper */
#statusBannerWrapper {
  text-align: center;
  width: 100%;
}

#statusBanner {
  display: inline-block;
  padding: 10px 14px;
  border-radius: 6px;
  font-size: 16px;
  font-weight: 600;
  display: none; /* hidden until used */
}

/* Banner types */
.status-saved {
  background: #d4edda;
  color: #155724;
}

.status-cleared {
  background: #cce5ff;
  color: #004085;
}

.status-out {
  background: #f8d7da;
  color: #721c24;
}

.status-error {
  background: #d9534f;
  color: white;
}


#statusBannerContainer {
  text-align: center;
}

/* ------------------------------------------------------------
   CALENDAR WIDTH CONTROL
------------------------------------------------------------ */
#calendarContainer {
  max-width: 900px;     /* prevents overly wide calendar */
  padding: 0 10px;      /* slight breathing room */
  position: relative;
}

/* ------------------------------------------------------------
   CALENDAR GRID
------------------------------------------------------------ */
.calendar {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  /*  justify-items: center;  */ /* centers each cell inside its column */
  gap: 0;
  /* margin-top: 10px; */
}

/* ------------------------------------------------------------
   DAY CELL RATIO CONTROL
   - Desktop/laptop: max 2:1 ratio
   - Phone: 1:1 ratio
------------------------------------------------------------ */
.day-cell {
  aspect-ratio: 2 / 1;     /* wider but not too wide */
  max-width: 160px;        /* larger boxes */
  min-width: 50px;         /* allows shrink */
  padding: 0;            /* slightly bigger interior */
  margin: 0;                  /* remove spacing */
  font-size: 18px;         /* slightly larger text */
  border: 1px solid #ddd;
  border-radius: 0;
  box-sizing: border-box;
  cursor: pointer;
  text-align: center;
  display: flex;
  align-items: center;                /* vertical center */
  justify-content: center;         /* horizontal center */
}

/* Perfect squares on phones */
@media (max-width: 600px) {
  .day-cell {
    aspect-ratio: 1 / 1;
  }
}


/* ------------------------------------------------------------
   ORIGINAL STYLES (unchanged)
------------------------------------------------------------ */
.cleared-banner {
  background-color: #f0f4ff;
  color: #2a4a8a;
  padding: 8px 12px;
  border-radius: 6px;
  margin-bottom: 10px;
  font-weight: 600;
  border: 1px solid #c7d6f7;
  animation: fadeIn 0.25s ease-out;
}

.info-icon {
  margin-left: 8px;
  cursor: help;
  font-weight: bold;
  font-size: 16px;
  color: rgba(255,255,255,0.9);
}
.info-icon::after { content: "ⓘ"; }

#saveBtn {
  padding: 8px 22px;
  background: #007bff;
  color: white;
  font-size: 15px;
}
#saveBtn:hover:not(:disabled) {
  background: #0056b3;
  border-color: #003f7f;
}
#saveBtn.pulse {
  animation: pulse 0.6s ease-in-out 2;
}
@keyframes pulse {
  0% { transform: scale(1); }
  50% { transform: scale(1.08); }
  100% { transform: scale(1); }
}

#scheduleToolbar {
  display: flex;
  flex-wrap: nowrap;
  align-items: center;
  justify-content: center;   /* NEW */
  margin-bottom: 16px;
}

#scheduleToolbar input[type="month"] {
  padding: 6px;
  font-size: 14px;
}

#monthPicker {
  font-weight: bold;
  font-size: 16px;
}

.toolbar-divider {
  display: flex;
  flex-shrink: 0;
  flex-grow: 0;
  width: 60px;
  align-items: center;
  justify-content: center;
  margin: 0 6px;
  position: relative;
  white-space: nowrap;
}
.toolbar-divider::before {
  content: "";
  position: absolute;
  right: 0;
  width: 1px;
  height: 22px;
  background: #c7c7c7;
}

.day-header {
  font-weight: bold;
  text-align: center;
  padding: 6px 0;
  background: #f0f0f0;
  border-radius: 4px;
}

.day-cell.playing {
  background-color: #4caf50;
  color: white;
}

.day-cell.empty {
  background: transparent;
  border: none;
  cursor: default;
}

.day-cell:focus {
  outline: 2px solid #2b7cff;
  outline-offset: 2px;
}

.day-cell[data-tooltip] { position: relative; }
.day-cell[data-tooltip]:hover::after {
  content: attr(data-tooltip);
  position: absolute;
  bottom: 110%;
  left: 50%;
  transform: translateX(-50%);
  background: #333;
  color: white;
  padding: 4px 8px;
  border-radius: 4px;
  font-size: 11px;
  white-space: nowrap;
  opacity: 0.9;
  pointer-events: none;
  z-index: 10;
}

.day-cell.disabled-day {
  background: #eee;
  color: #999;
  border: 1px solid #ccc;
  cursor: not-allowed;
}
.day-cell.disabled-day:hover {
  background: #e8e8e8;
}

.calendar.jump-highlight {
  animation: jumpFlash 0.6s ease-out;
}
@keyframes jumpFlash {
  0% { background-color: #fff8c6; }
  100% { background-color: transparent; }
}

/* Modal (unchanged) */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.45);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 999;
}
.modal-content {
  background: white;
  padding: 20px;
  width: 360px;
  border-radius: 10px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.25);
  animation: pop 0.25s ease;
  text-align: center;
}
@keyframes pop {
  from { transform: scale(0.95); opacity: 0; }
  to   { transform: scale(1); opacity: 1; }
}
.modal-buttons {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin-top: 15px;
}
.modal-buttons button {
  padding: 10px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-size: 15px;
}
.modal-buttons .primary { background: #007bff; color: black; }
.modal-buttons .warning { background: #f0ad4e; color: black; }
.modal-buttons .danger { background: #d9534f; color: white; }
.modal-buttons .secondary { background: #6c757d; color: black; }

/* ------------------------------------------------------------
   LEGEND (left-aligned under Sunday)
------------------------------------------------------------ */
.calendar-legend {
  margin-top: 12px;
  display: flex;
  /* gap: 20px; */
  font-size: 16px;
  color: #444;
  justify-content: center;
}

.legend-box {
  width: 20px;               /* bigger */
  height: 20px;
  border: 1px solid #aaa !important;
  border-radius: 3px; 
  display: inline-block;
}

/* Playing */
.legend-box.playing {
  background: #4caf50 !important;
  border-color: #4caf50 !important;
}

/* Available */
.legend-box.available {
  background: #ffffff;
  border-color: #ffffff;
}

/* League does not play */
.legend-box.disabled-day {
  background: #eee !important;
  border-color: #ccc !important;
}

</style>

</head>

<body>

<div id="nav-container"></div>
<link id="nav-css" rel="stylesheet">
<script src="/js/nav-loader.js"></script>

<div id="user-identity-container"></div>

<h1 id="pageHeader"></h1>

<div id="statusBannerWrapper">
  <div id="statusBanner" class="status-banner">
    <span id="statusText"></span>
    <span id="statusInfo" class="info-icon" title=""></span>
  </div>
</div>

<div id="clearedBanner" class="status-banner cleared-banner" style="display:none;">
  This month was cleared.
</div>

<!-- Toolbar with Month Picker -->
<div id="scheduleToolbar">
  <input 
     type="month" 
     id="monthPicker"
     title="You may select the current month or any of the next 12 months."
   >
   <a id="jumpToday" style="margin-left:6px; font-size:14px; cursor:pointer; color:#2b7cff;">
        Today
  </a>

  <div class="toolbar-divider"></div>

  <button id="saveBtn" disabled>Save</button>
  <span id="savingIndicator" style="display:none; margin-left:10px; font-size:14px; color:#555;">
    Saving…
  </span>
  <button id="defaultBtn">Default</button>
  <button id="clearBtn">Clear</button>
  <div id="unsavedIndicator">• Unsaved changes</div>
</div>

<div id="calendarContainer"></div>

<div id="calendarLegend" class="calendar-legend">
  <span class="legend-item">
    <span class="legend-box playing"></span> Playing
  </span>
  <span class="legend-item">
    <span class="legend-box available"></span> Available
  </span>
  <span class="legend-item">
    <span class="legend-box disabled-day"></span> League does not play
  </span>
</div>

<script>
// ==========================
// global variables
// ========================== 
let targetUserId = null;
let isAdminMode = false;
let defaultJustRan = false;
let origInTownStatus = 1;   //default to 1 (in town) until we fetch the real value from the server
let leaguePlayDays = [];
let sessionStartTS = null;

document.addEventListener("DOMContentLoaded", () => {
  console.log("Schedule JS running");

  function detectAdminOverride() {
    const parts = window.location.pathname.split("/");
    console.log(">>> DEBUG: file=schedule.html - URL parts:", parts);
    if (parts[1] === "admin" && parts[2] === "schedule") {
      targetUserId = parseInt(parts[3]);
      isAdminMode = true;
      console.log("Admin override schedule page for userId:", targetUserId);
    } else {
      isAdminMode = false;
      console.log("Normal user schedule page");
    }
  }
  
  detectAdminOverride();   // ⭐ REQUIRED ⭐

  // Wait a bit for nav-loader.js to finish inserting the nav
  setTimeout(() => {

    // ⭐ ADMIN MODE: Replace user nav bar with admin override nav bar
    if (isAdminMode) {
      const nav = document.getElementById("nav-container");

      nav.innerHTML = `
        <div class="nav-bar" style="display:flex; justify-content:space-between; align-items:center; padding:10px 20px; background:#2b7cff; color:white;">
          <div class="nav-left" style="font-size:20px; font-weight:bold;">
            Golf Scheduler
          </div>
          <div class="nav-right">
            <a href="/admin/golfers" class="nav-link" style="color:white; font-size:16px; text-decoration:none;">
              Return to Manage Golfers
            </a>
          </div>
        </div>
      `;
    }

    // ⭐ USER MODE: Keep existing nav-link modal protection
    document.querySelectorAll(".nav-link").forEach(link => {
      link.addEventListener("click", (e) => {
        // ⭐ Skip modal for Clear and Default buttons
        if (link.id === "clearBtn" || link.id === "defaultBtn") {
          return;
        }

        if (!unsavedChanges) return;

        e.preventDefault();

        requireNoUnsavedChanges({
          onSave: async () => {
            console.log(">>> DEBUG: nav link clicked - onSave callback");
            await saveSchedule();
            window.onbeforeunload = null;
            window.location = link.href;
          },
          onContinue: () => {
            window.onbeforeunload = null;
            console.log(">>> DEBUG: nav link clicked - onContinue callback");
            window.location = link.href;
          },
          onCancel: () => {}
        });
      });
    });

  }, 200);

  // --- SAFE modal button bindings (unchanged) ---
  const unsavedSaveBtn = document.getElementById("unsavedSave");
  if (unsavedSaveBtn) {
    unsavedSaveBtn.addEventListener("click", async () => {
      hideUnsavedChangesModal();
      if (unsavedModalCallbacks.onSave) await unsavedModalCallbacks.onSave();
    });
  }

  const unsavedContinueBtn = document.getElementById("unsavedContinue");
  if (unsavedContinueBtn) {
    unsavedContinueBtn.addEventListener("click", () => {
      hideUnsavedChangesModal();
      if (unsavedModalCallbacks.onContinue) unsavedModalCallbacks.onContinue();
    });
  }

  const unsavedCancelBtn = document.getElementById("unsavedCancel");
  if (unsavedCancelBtn) {
    unsavedCancelBtn.addEventListener("click", () => {
      hideUnsavedChangesModal();
      if (unsavedModalCallbacks.onCancel) unsavedModalCallbacks.onCancel();
    });
  }

  // ---- Page initialization ----
  loadPageHeader();
  configureMonthPickerLimits();
  wireUpEventListeners();
  initSchedulePage();
});

// ---- State ----
let savedSchedule = null;
let currentSchedule = null;
let unsavedChanges = false;

let unsavedModalCallbacks = {
  onSave: null,
  onContinue: null,
  onCancel: null
};

// ---- Modal helpers ----
function showUnsavedChangesModal(callbacks) {
  unsavedModalCallbacks = callbacks;
  const modal = document.getElementById("unsavedModal");
  if (!modal) {
    console.warn("Unsaved modal not present on this page.");
    return;
  }
  modal.style.display = "flex";
}

function hideUnsavedChangesModal() {
  const modal = document.getElementById("unsavedModal");
  if (!modal) return;
  modal.style.display = "none";
}

// ---- Unsaved changes gate ----
function requireNoUnsavedChanges(callbacks) {
  if (!unsavedChanges) {
    callbacks.onContinue();
    return;
  }
  showUnsavedChangesModal(callbacks);
}

// ---- Helpers ----
function showErrorBanner(msg) {
  const banner = document.getElementById("statusBanner");
  banner.textContent = msg;
  banner.style.background = "#d9534f"; // red
  banner.style.display = "block";
}

function focusDay(dayNumber) {
  const selector = `.day-cell[data-date$="-${String(dayNumber).padStart(2,"0")}"]`;
  const target = document.querySelector(selector);
  if (target) target.focus();
}

function showSaving() {
  document.getElementById("savingIndicator").style.display = "inline";
}

function hideSaving() {
  document.getElementById("savingIndicator").style.display = "none";
}

function markUnsaved() {
  unsavedChanges = true;
  refreshSaveUI();
}

function highlightInvalidDates(dates) {
  dates.forEach(date => {
    const cell = document.querySelector(`[data-date="${date}"]`);
    if (cell) {
      cell.classList.add("invalid-date");
    }
  });
}

function refreshSaveUI() {
  console.log(">>> DEBUG: refreshSaveUI() called.");
    // ⭐ Prevent unwanted reload after Default runs
  // if (isAdminMode && defaultJustRan) {
  //   console.log(">>> DEBUG: Skipping refreshSaveUI because default just ran");
  //   return;
  //  }
  const saveBtn = document.getElementById("saveBtn");
  const ind = document.getElementById("unsavedIndicator");

  if (unsavedChanges) {
    saveBtn.disabled = false;
    ind.style.display = "block";

    // Pulse only when unsavedChanges transitions from false → true
    if (!saveBtn.classList.contains("pulse")) {
      saveBtn.classList.add("pulse");
      setTimeout(() => saveBtn.classList.remove("pulse"), 700);
    }

  } else {
    saveBtn.disabled = true;
    ind.style.display = "none";
  }
}

// remove function below if we get the new dynamic nav bar loader code working (loadNav)
function loadNavBar() {
  fetch("/partials/user-nav.html")
    .then(res => res.text())
    .then(html => {
      document.getElementById("navContainer").innerHTML = html;

      // highlight active link
      const path = window.location.pathname;
      document.querySelectorAll("#topNav .nav-link").forEach(link => {
        if (link.getAttribute("href") === path) {
          link.classList.add("active");
        }
      });

      // ⭐ Attach unsaved-changes navigation warning
      document.querySelectorAll("#topNav a").forEach(link => {
        link.addEventListener("click", (e) => {
          if (!unsavedChanges) return;

          e.preventDefault();

          requireNoUnsavedChanges({
            onSave: async () => {
              await saveSchedule();
              window.onbeforeunload = null;
              window.location = link.href;
            },
            onContinue: () => {
              window.onbeforeunload = null;
              window.location = link.href;
            },
            onCancel: () => {}
          });

        });
      });
    });
}

function updateStatusBanner(status) {

  // ⭐ Prevent unwanted reload after Default runs
  // if (isAdminMode && defaultJustRan) {
  //   console.log(">>> DEBUG: Skipping updateStatusBanner because default just ran");
  //   return;
  // }

  const banner = document.getElementById("statusBanner");
  const text = document.getElementById("statusText");
  const infoIcon = document.getElementById("statusInfo");

  // Reset classes
  banner.className = "status-banner";

  // 1. OUT OF TOWN always overrides everything
  if (status === "out_of_town") {
    banner.classList.add("status-out");
    banner.style.display = "inline-block";
    text.textContent = "This month is marked as Out of Town";
    infoIcon.style.display = "inline-block";
    infoIcon.title = "You are marked Out of Town for this month. Play days cannot be saved.";
    return;
  }

  // 2. UNSAVED CHANGES overrides saved/cleared/default
  if (unsavedChanges) {
    banner.classList.add("status-unsaved");
    banner.style.display = "inline-block";
    text.textContent = "You have unsaved changes";
    infoIcon.style.display = "none";
    return;
  }

  // 3. SAVED
  if (status === "saved") {
    banner.classList.add("status-saved");
    banner.style.display = "inline-block";
    text.textContent = "Saved schedule";
    infoIcon.style.display = "none";
    return;
  }

  // 4. NEW month (blank, untouched)
  if (status === "new") {
    banner.classList.add("status-cleared");
    banner.style.display = "inline-block";
    text.textContent = "New month. Click Default to load your usual play days.";
    infoIcon.style.display = "none";
    return;
  }
// 5. CLEARED (user saved an empty month)
if (status === "cleared") {
  banner.classList.add("status-cleared");
  banner.style.display = "inline-block";
  text.textContent = "No schedule saved for this month.";
  infoIcon.style.display = "none";
  return;
}

// 6. DEFAULT (user clicked Default but has not saved)
if (status === "default") {
  banner.classList.add("status-unsaved");
  banner.style.display = "inline-block";
  text.textContent = "Default schedule loaded. Review and Save.";
  infoIcon.style.display = "none";
  console.log(">>> DEBUG: within [if (status ===  default)...] block of updateStatusBanner");
  return;
}

// 7. Fallback: hide banner
  banner.style.display = "none";

  console.log(">>> DEBUG: updateStatusBanner COMPLETED");
}

function getMonthParts() {
  const [year, month] = document.getElementById("monthPicker").value.split("-");
  return { year, month };
}

function renderCalendar(schedule) {
  const container = document.getElementById("calendarContainer");
  container.innerHTML = "";

  const [year, month] =  document.getElementById("monthPicker").value.split("-").map(Number);
  const firstDay = new Date(year, month - 1, 1);
  const lastDay = new Date(year, month, 0);
  const totalDays = lastDay.getDate();

  const calendar = document.createElement("div");
  calendar.className = "calendar";

  // ---- Day headers ----
  const dayNames = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  dayNames.forEach(d => {
    const div = document.createElement("div");
    div.className = "day-header";
    div.textContent = d;
    calendar.appendChild(div);
  });

  // ---- Leading blanks ----
  for (let i = 0; i < firstDay.getDay(); i++) {
    const blank = document.createElement("div");
    blank.className = "day-cell empty";
    calendar.appendChild(blank);
  }

// ---- Day cells ----
for (let d = 1; d <= totalDays; d++) {
  const fullDate =
    `${year}-${String(month).padStart(2,'0')}-${String(d).padStart(2,'0')}`;

  const isPlaying = schedule && schedule[fullDate] === true;

  const cell = document.createElement("div");
  cell.className = "day-cell";
  cell.dataset.date = fullDate;
  cell.textContent = d;

  if (isPlaying) cell.classList.add("playing");

  // ⭐ Disable invalid league days
  const dow = new Date(year, month - 1, d).getDay();
  cell.dataset.dow = dow;
  
  if (!leaguePlayDays.includes(dow)) {
    cell.classList.add("disabled-day");
    cell.setAttribute("data-tooltip", "League does not play on this day");
  }

  // Make cell focusable
  cell.tabIndex = 0;

  // ---- Keyboard navigation ----
  cell.addEventListener("keydown", (e) => {
    const day = d;

    switch (e.key) {
      case "ArrowLeft":
        if (day > 1) focusDay(day - 1);
        break;
      case "ArrowRight":
        if (day < totalDays) focusDay(day + 1);
        break;
      case "ArrowUp":
        if (day - 7 >= 1) focusDay(day - 7);
        break;
      case "ArrowDown":
        if (day + 7 <= totalDays) focusDay(day + 7);
        break;
      case " ":
      case "Enter":
        // Prevent toggling invalid days
        if (cell.classList.contains("disabled-day")) {
           cell.classList.add("shake");
          setTimeout(() => cell.classList.remove("shake"), 250);
          break;
        }

        cell.classList.toggle("playing");
        markUnsaved();
        break;
      }
  });

  // ---- Mouse click toggle ----
  cell.addEventListener("click", () => {

    // Always remove invalid border on click
    cell.classList.remove("invalid-date");

    // If this date is NOT allowed by league rules
    if (cell.classList.contains("disabled-day")) {
      cell.classList.add("shake");
      setTimeout(() => cell.classList.remove("shake"), 250);
      return; // do NOT toggle selection
    }

    // Normal toggle logic
    cell.classList.toggle("playing");
    markUnsaved();
  });

  calendar.appendChild(cell);
}
  console.log("renderCalendar schedule =", schedule);
  container.appendChild(calendar);
}

// ---- Buttons ----

// SAVE
// ----------------------
async function saveSchedule() {
  const { year, month } = getMonthParts();

  console.log("saveSchedule() fired");

  // Build schedule object from calendar
  const schedule = {};
  document.querySelectorAll(".day-cell").forEach(cell => {
    if (!cell.dataset.date) return;
    const fullDate = cell.dataset.date;
    const isPlaying = cell.classList.contains("playing");
    schedule[fullDate] = isPlaying;
  });

  showSaving();

  // ⭐ Force browser to repaint BEFORE fetch begins
  await new Promise(requestAnimationFrame);

  // ⭐ Determine correct URL + payload based on mode
  let url;
  let payload;

  if (isAdminMode) {
    // ⭐ ADMIN OVERRIDE SAVE ROUTE
    url = `/admin/schedule/save/${origInTownStatus}/${sessionStartTS}`;

    payload = {
      target_user_id: targetUserId,
      year,
      month,
      schedule
    };

  } else {
    // ⭐ NORMAL USER SAVE ROUTE
    url = `/user/schedule/${year}/${month}`;

    payload = {
      schedule,
      sessionStartTS   // sent in body, not URL
    };
  }

  console.log("SAVE payload:", payload);

  const res = await fetch(url, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload)
  });

  const data = await res.json();

  // Update UI
  currentSchedule = data.schedule || {};
  unsavedChanges = false;

  renderCalendar(currentSchedule);
  refreshSaveUI();
  updateStatusBanner(data.status);

  hideSaving();
}

function regenerateDefaultSchedule() {
  console.log(">>> DEBUG: regenerateDefaultSchedule() called");
  const { year, month } = getMonthParts();

  let url;
  let headers = {};
  let body;

  if (isAdminMode) {
    url = `/admin/schedule/default`;
    headers = { "Content-Type": "application/json" };

    body = JSON.stringify({
        target_user_id: targetUserId,
        year,
        month
    });
    
  } else {
    url = `/user/schedule/default/${year}/${month}`;
    body = undefined;
  }

  fetch(url, {
    method: "POST",
    headers,
    body
  })
  .then(res => res.json())
  .then(data => {

    if (data.status === "out_of_town") {
      showOutOfTownPrompt(year, month);
      updateStatusBanner("out_of_town");
      return;
    }
    console.log(">>> DEBUG: regenerateDefaultSchedule - fetch completed, url=", url, ", data =", data);
    // ⭐ Update BOTH current and saved schedule
    
    currentSchedule = data.schedule || {};
    savedSchedule = currentSchedule;
    console.log(">>> DEBUG: regenerateDefaultSchedule - after updating currentSchedule and savedSchedule=", currentSchedule);

    // ⭐ Paint calendar grid
    renderCalendar(currentSchedule);
    console.log(">>> DEBUG: regenerateDefaultSchedule - renderCalendar COMPLETED");

    // ⭐ Admin mode MUST paint green days AFTER renderCalendar
    if (isAdminMode) {
      applyScheduleToCalendar(currentSchedule, leaguePlayDays);
      console.log(">>> DEBUG: regenerateDefaultSchedule - applyScheduleToCalendar COMPLETED");
    }

    markUnsaved();
    console.log(">>> DEBUG: regenerateDefaultSchedule - markUnsaved COMPLETED");
    updateStatusBanner(data.status);
    console.log(">>> DEBUG: regenerateDefaultSchedule - updateStatusBanner COMPLETED");
    // ⭐ Prevent the month loader from overwriting the default schedule
    return;
  });
}

      fetch("/user/selected-league").then(r => r.json())

    const adminName = `${adminUser.first_name} ${adminUser.last_name}`;

    let pageHeaderText = "";

      const initData = await fetch(`/admin/schedule/init/${targetUserId}/${MonthNum}`).then(r => r.json());
      const targetUser = initData.user;

      sessionStartTS = initData.easternTS;

                  called targetUser  =", targetUser`);

      const targetUserName = `${targetUser.first_name} ${targetUser.last_name}`;

// ---- Apply schedule to calendar cells (used in admin mode only
function applyScheduleToCalendar(scheduleObj, leaguePlayDays) {
  console.log(">>> DEBUG: applyScheduleToCalendar called");

  const cells = document.querySelectorAll(".day-cell");

  cells.forEach(cell => {
    const dateString = cell.dataset.date;
    const dow = parseInt(cell.dataset.dow);

    // Skip leading blank cells
    if (!dateString) return;

    // Disable non-play days
    if (!leaguePlayDays.includes(dow)) {
      cell.classList.add("disabled-day");
      cell.dataset.tooltip = "League does not play on this day";
      return;
    }

    // Paint playing days
    if (scheduleObj[dateString]) {
      cell.classList.add("playing");
    }
  });
}

async function loadScheduleForCurrentMonth() {
  // ⭐ Prevent overwrite after Default runs
  console.log(">>> DEBUG: ENTER loadScheduleForCurrentMonth");
  // if (isAdminMode && defaultJustRan) {
  //     console.log(">>> DEBUG: Skipping reload because default just ran");
  //     return;   // ⭐ Do NOT reset here
  // }

  const { year, month } = getMonthParts();

  // ⭐ Persist last viewed month (ALWAYS user route)
  await fetch("/user/set-last-month", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ year, month })
  });

  // ⭐ Choose correct schedule load URL
  const url = isAdminMode
    ? `/admin/schedule/${targetUserId}/${year}/${month}`
    : `/user/schedule/${year}/${month}`;

  const res = await fetch(url);
  console.log(">>> DEBUG: schedule.html - url=", url, " - schedule load response status =", res.status);
  const data = await res.json();

  console.log(">>> DEBUG: schedule load response =", data);
if (isAdminMode) {
    console.log(">>> DEBUG: ADMIN MODE — applying scheduleObj and leaguePlayDays");

    const scheduleObj = data.schedule || {};

    // ⭐ CRITICAL — set global BEFORE renderCalendar()
    leaguePlayDays = data.leaguePlayDays || [];

    currentMonthInTown = data.user.in_town === 1;

    console.log(">>> DEBUG: - loadScheduleForCurrentMonth - scheduleObj =", scheduleObj);
    console.log(">>> DEBUG: BEFORE renderCalendar - leaguePlayDays =", leaguePlayDays);

    renderCalendar(scheduleObj);

    console.log(">>> DEBUG: AFTER renderCalendar - leaguePlayDays =", leaguePlayDays);

    applyScheduleToCalendar(scheduleObj, leaguePlayDays);

    savedSchedule = scheduleObj;
    currentSchedule = scheduleObj;

    return;   // ⭐ MUST BE HERE
}

  // ⭐ Store league play days
  leaguePlayDays = data.leaguePlayDays || [];

  // ⭐ Update in-town state
  currentMonthInTown = data.in_town === 1;

  // ⭐ Reset unsaved state FIRST
  unsavedChanges = false;
  refreshSaveUI();

  // ⭐ Update banner
  updateStatusBanner(data.status);

  // ⭐ Interpret backend status
  switch (data.status) {
    case "out_of_town":
      savedSchedule = null;
      currentSchedule = {};
      renderCalendar({});
      return;

    case "default":
      savedSchedule = null;
      currentSchedule = data.schedule;
      renderCalendar(data.schedule);
      unsavedChanges = true;
      refreshSaveUI();
      return;

    case "cleared":
      savedSchedule = null;
      currentSchedule = {};
      renderCalendar({});
      return;

    case "saved":
      savedSchedule = data.schedule;
      currentSchedule = data.schedule;
      renderCalendar(data.schedule);
      return;

    default:
      console.warn("Unknown schedule status:", data.status);
      savedSchedule = null;
      currentSchedule = {};
      renderCalendar({});
  }
}

function configureMonthPickerLimits() {
  console.log(">>> DEBUG: configureMonthPickerLimits() called");
  const monthPicker = document.getElementById("monthPicker");
  const now = new Date();

  const currentYear = now.getFullYear();
  const currentMonth = now.getMonth() + 1;

  const maxDate = new Date(now);
  maxDate.setMonth(maxDate.getMonth() + 12);

  const maxYear = maxDate.getFullYear();
  const maxMonth = maxDate.getMonth() + 1;

  const pad = n => String(n).padStart(2, "0");

  const minValue = `${currentYear}-${pad(currentMonth)}`;
  const maxValue = `${maxYear}-${pad(maxMonth)}`;

  monthPicker.min = minValue;
  monthPicker.max = maxValue;

  if (monthPicker.value < minValue) {
    monthPicker.value = minValue;
  }
  if (monthPicker.value > maxValue) {
    monthPicker.value = maxValue;
  }
}

function showOutOfTownSaveModal() {
  const modal = document.getElementById("outOfTownModal");
  modal.style.display = "flex";

  // Replace modal text for SAVE scenario
  modal.querySelector("h2").textContent = "Out of Town";
  modal.querySelector("p").textContent =
    "You selected play days. What would you like to do?";

  // Clear Month
  document.getElementById("clearMonthBtn").onclick = () => {
    modal.style.display = "none";
    const { year, month } = getMonthParts();
    clearMonthSchedule(year, month);
    console.log(">>> DEBUG: clearMonthBtn calling loadScheduleForCurrentMonth");
    loadScheduleForCurrentMonth();
  };

  // Mark In Town + Save
  document.getElementById("markInTownBtn").onclick = async () => {
    modal.style.display = "none";
    const { year, month } = getMonthParts();
    regenerateDefaultScheduleForceInTown(year, month);
    await saveSchedule();
  };

  // Cancel
  document.getElementById("cancelOutOfTownBtn").onclick = () => {
    modal.style.display = "none";
  };
}

function wireUpJumpToday() {
  console.log(">>> DEBUG: wireUpJumpToday() called");
  const btn = document.getElementById("jumpToday");
  if (!btn) return;

  btn.addEventListener("click", async () => {
    const now = new Date();
    const year = now.getFullYear();
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const day = now.getDate();

    const picker = document.getElementById("monthPicker");
    picker.value = `${year}-${month}`;
    console.log(">>> DEBUG: monthPicker CHANGE triggered loadScheduleForCurrentMonth");
    // Reload schedule
    await loadScheduleForCurrentMonth();

    // Focus today's cell
    focusDay(day);

    // Highlight animation
    const container = document.querySelector(".calendar");
    if (container) {
      container.classList.add("jump-highlight");
      setTimeout(() => container.classList.remove("jump-highlight"), 700);
    }
  });
}

window.onbeforeunload = (e) => {
  if (!unsavedChanges) return;
  e.preventDefault();
  e.returnValue = "";
};

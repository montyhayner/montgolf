<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Allocate Tee Times</title>
  <link rel="stylesheet" href="/css/admin.css">
  <style>
    .tee-time-row {
      display: flex;
      gap: 12px;
      margin-bottom: 6px;
      align-items: center;
    }
    .tee-time-row input {
      width: 120px;
    }
  </style>
</head>

<body>
  <div class="admin-container">

    <h2>Allocate Tee Times</h2>

    <!-- PLAY DATE INPUT -->
    <div>
      <label>Play Date:</label>
      <input type="date" id="playDateInput">
      <button id="loadBtn">Load</button>
    </div>

    <hr>

    <!-- EXISTING TEE TIMES TABLE -->
    <div id="existingBlock" style="display:none;">
      <h3>Existing Tee Times</h3>
      <table class="admin-table">
        <thead>
          <tr>
            <th>#</th>
            <th>Tee Time</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="teeTimesTableBody"></tbody>
      </table>

      <button id="editBlockBtn">Edit Block</button>
      <button id="deleteBlockBtn" style="margin-left:10px;">Delete Entire Block</button>
    </div>

    <!-- GENERATE NEW BLOCK -->
    <div id="generateBlock" style="display:none;">
      <h3>Generate Tee Times</h3>

      <label>Starting Tee Time:</label>
      <input type="time" id="startTimeInput">

      <label style="margin-left:20px;">Number of Tee Times:</label>
      <input type="number" id="countInput" min="1" max="20">

      <button id="generateBtn">Generate</button>
    </div>

  </div>

  <!-- EDIT / GENERATE MODAL -->
  <div id="teeTimesModal" class="modal-overlay" style="display:none;">
    <div class="modal">
      <h3>Edit Tee Times</h3>

      <div id="modalTeeTimes"></div>

      <div style="margin-top:20px;">
        <button id="saveModalBtn">Save</button>
        <button id="closeModalBtn">Cancel</button>
      </div>
    </div>
  </div>

  <script src="/js/admin-allocated-tee-times.js"></script>
</body>
</html>

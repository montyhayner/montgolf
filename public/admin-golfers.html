<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage Golfers</title>

    <link rel="stylesheet" href="/css/admin-nav.css">
    <link rel="stylesheet" href="/css/admin-identity.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            margin: 0;
            padding: 0;
        }

        .container h1 {
            text-align: center;
        }

        .create-golfer-container {
            text-align: center;
            margin: 20px 0;   /* optional but looks cleaner */
         }

        .container {
            max-width: 1100px;
            margin: 6px auto;
            background: white;
            padding: 12px 24px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .container h1 {
            text-align: center;
            margin-top: 0 !important;
            padding-top: 0 !important;
        }


        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 25px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #f0f0f0;
            cursor: pointer;
        }

        .btn {
            background: #3498db;
            color: white;
            padding: 10px 16px;
            border-radius: 6px;
            text-decoration: none;
            cursor: pointer;
        }

#loadingOverlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(255,255,255,0.6);
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 3000;
}

/* Reduce top spacing above the Manage Golfers header */
.page-header {
    margin-top: 4px !important;
    padding-top: 0 !important;
}

h1 {
    margin-top: 0 !important;
    padding-top: 0 !important;
}

.spinner {
  width: 40px;
  height: 40px;
  border: 4px solid #ccc;
  border-top-color: #3498db;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
        }

        .modal {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 400px;
        }

        .modal input {
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }
        /* Compact golfer table rows */
        #golfer-table tbody tr {
            height: 22px;                 /* half-height */
        }

        #golfer-table td {
            padding: 4px 6px !important;  /* much tighter */
            line-height: 1.1;             /* compact text */
            font-size: 14px;              /* slightly smaller */
        }

        /* Compact header row too */
        #golfer-table th {
            padding: 6px 6px !important;
            font-size: 14px;
        }

        /* Compact action buttons */
        .btn-small {
            padding: 2px 6px !important;
            font-size: 12px !important;
            line-height: 1.0 !important;
        }

        .sort-arrow {
            font-size: 12px;
            margin-left: 4px;
            opacity: 0.6;
        }

        .sort-arrow.asc::after {
            content: "▲";
        }

        .sort-arrow.desc::after {
            content: "▼";
        }

        th.active-sort {
            font-weight: bold;
            color: #2c3e50;
        }

    </style>
</head>

<body>
    <div id="nav-container"></div>
    <link id="nav-css" rel="stylesheet">
    <script src="/js/nav-loader.js"></script>

    <div id="admin-identity-container"></div>

    <div class="container">
        <h1>Manage Golfers</h1>

        <div class="create-golfer-container">
            <button class="btn" onclick="openCreateModal()">+ Add Golfer</button>
        </div>

        <table id="golfer-table">
            <thead>
                <tr>
                    <th onclick="sortGolfers('last_name')">
                        Last Name<span class="sort-arrow" data-col="last_name"></span>
                    </th>
                    <th onclick="sortGolfers('first_name')">
                        First Name<span class="sort-arrow" data-col="first_name"></span>
                    </th>
                    <th onclick="sortGolfers('email')">
                        Email<span class="sort-arrow" data-col="email"></span>  
                    </th>
                    <th onclick="sortGolfers('is_admin')">
                        Admin<span class="sort-arrow" data-col="is_admin"></span>
                    </th>
                    <th onclick="sortGolfers('is_member')">
                        Member<span class="sort-arrow" data-col="is_member"></span>
                    </th>
                    <th onclick="sortGolfers('subgroup')">
                        Subgroup<span class="sort-arrow" data-col="subgroup"></span>
                    </th>
                    <th onclick="sortGolfers('subgroup_number')">
                        #<span class="sort-arrow" data-col="subgroup_number"></span>
                    </th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

<!-- Add Golfer Modal -->
<div class="modal-bg" id="create-modal" style="display:none;">
    <div class="modal">

        <h2>Add Golfer</h2>

        <input id="first-name" placeholder="First Name">
        <input id="last-name" placeholder="Last Name">
        <input id="email" placeholder="Email">
        <input id="password" placeholder="Password" type="password">

        <input id="subgroup" placeholder="Subgroup (A–Z or blank)">
        <input id="subgroup-number" placeholder="Subgroup Number (1–9 or blank)" type="number">

        <label><input type="checkbox" id="is-admin"> Admin</label><br>
        <label><input type="checkbox" id="is-member" checked> Member</label>

        <div class="modal-buttons">
            <button class="btn" onclick="createGolfer()">Add</button>
            <button class="btn btn-danger" onclick="closeCreateModal()">Cancel</button>
        </div>

    </div>
</div>
<!-- Edit Golfer Modal -->
<div class="modal-bg" id="edit-modal" style="display:none;">
    <div class="modal">

        <h2>Edit Golfer</h2>

        <input id="edit-first-name" placeholder="First Name">
        <input id="edit-last-name" placeholder="Last Name">
        <input id="edit-email" placeholder="Email">

        <input id="edit-subgroup" placeholder="Subgroup (A–Z or blank)">
        <input id="edit-subgroup-number" placeholder="Subgroup Number (1–9 or blank)" type="number">

        <label><input type="checkbox" id="edit-is-admin"> Admin</label><br>
        <label><input type="checkbox" id="edit-is-member"> Member</label>

        <div class="modal-buttons">
            <button class="btn" onclick="saveGolferEdits()">Save</button>
            <button class="btn btn-danger" onclick="closeEditModal()">Cancel</button>
        </div>

    </div>
</div>

<!-- Reset Password Modal -->
<div class="modal-bg" id="reset-password-modal" style="display:none;">
    <div class="modal">

        <h2>Reset Password</h2>

        <input id="reset-password" type="password" placeholder="New Password">
        <input id="reset-password-confirm" type="password" placeholder="Confirm Password">

        <div class="modal-buttons">
            <button class="btn" onclick="savePasswordReset()">Save</button>
            <button class="btn btn-danger" onclick="closeResetPasswordModal()">Cancel</button>
        </div>

    </div>
</div>

<script>

// -------------------------------------------------------
// Load Admin Nav Bar
//--------------------------------------------------------
async function loadAdminNav() {
    const navContainer = document.getElementById("admin-nav-container");
    const res = await fetch("/partials/admin-nav.html", { credentials: "include" });
    const html = await res.text();
    navContainer.innerHTML = html;

    // Highlight current page
    const path = window.location.pathname;

    document.querySelectorAll(".admin-nav .nav-links a").forEach(link => {
        const href = link.getAttribute("href");
        if (href === path || (href !== "/" && path.startsWith(href))) {
            link.classList.add("active");
        }
    });

    return true;
}

// -------------------------------------------------------
// Load Session variable values
//--------------------------------------------------------
async function loadSession() {
    const res = await fetch("/admin/session-info", { credentials: "include" });
    const session = await res.json();

    // Show Leagues link only for Super Admin
    const leaguesLink = document.getElementById("nav-leagues-link");
    if (leaguesLink) {
        leaguesLink.style.display = session.is_super_admin ? "inline-block" : "none";
    }

    return session;   // ⭐ CRITICAL
}

// --------------------------------------------------------------------------
//   Populate Identity bar (icon + role + name + color)
// --------------------------------------------------------------------------
async function loadAdminIdentity(session) {
    const container = document.getElementById("admin-identity-container");
    if (!container) return;

    const html = await fetch("/partials/admin-identity.html").then(r => r.text());
    container.innerHTML = html;

    const bar = container.querySelector(".admin-identity");
    const icon = container.querySelector("#identity-icon");
    const role = container.querySelector("#identity-role");
    const name = container.querySelector("#identity-name");
    const leagueBadge = container.querySelector("#identity-league");

    // Always show admin's name
    name.innerText = `${session.first_name} ${session.last_name}`;

    if (session.is_super_admin) {
        // Super Admin styling
        bar.classList.add("super-admin");
        icon.innerText = "⭐";
        role.innerText = "Super Admin";

        // Show league with prefix
        if (session.league_name) {
            leagueBadge.innerText = `Current League: ${session.league_name}`;
            leagueBadge.style.display = "inline-block";
        } else {
            leagueBadge.style.display = "none";
        }

    } else {
        // League Admin styling
        bar.classList.add("league-admin");
        icon.innerText = "🏌️";
        role.innerText = "League Admin";

        // Show league name without prefix
        if (session.league_name) {
            leagueBadge.innerText = session.league_name;
            leagueBadge.style.display = "inline-block";
        } else {
            leagueBadge.style.display = "none";
        }
    }
}

// GLOBAL SORT STATE
let currentSortColumn = null;
let currentSortDirection = "asc";   // "asc" or "desc"

// GENERIC SORT HANDLER
function sortGolfers(column) {
    // If clicking same column → flip direction
    if (currentSortColumn === column) {
        currentSortDirection = currentSortDirection === "asc" ? "desc" : "asc";
    } else {
        currentSortColumn = column;
        currentSortDirection = "asc";   // default on new column
    }

    let golfers = [...window.currentGolfers];

    // SPECIALTY SORT: subgroup + subgroup_number
    if (column === "subgroup" || column === "subgroup_number") {
        golfers.sort((a, b) => {
            // Blank subgroup should sort last
            const subA = a.subgroup || "ZZZ";
            const subB = b.subgroup || "ZZZ";

            if (subA < subB) return -1;
            if (subA > subB) return 1;

            // Same subgroup → sort subgroup_number ascending ALWAYS
            return a.subgroup_number - b.subgroup_number;
        });

        // If user clicked twice → reverse whole list
        if (currentSortDirection === "desc") {
            golfers.reverse();
        }

    } else {
        // NORMAL SORT
        golfers.sort((a, b) => {
            let valA = a[column];
            let valB = b[column];

            // Case-insensitive for strings
            if (typeof valA === "string") valA = valA.toLowerCase();
            if (typeof valB === "string") valB = valB.toLowerCase();

            if (valA < valB) return currentSortDirection === "asc" ? -1 : 1;
            if (valA > valB) return currentSortDirection === "asc" ? 1 : -1;
            return 0;
        });
    }
    // Re-render table
    renderGolfers(golfers);
    // Update arrows
    updateSortArrows();
}

function updateSortArrows() {
    // 1. Remove arrows from ALL columns
    document.querySelectorAll(".sort-arrow").forEach(arrow => {
        arrow.classList.remove("asc", "desc");

        // 2. Find the arrow whose data-col matches the column being sorted
        const col = arrow.getAttribute("data-col");

        // 3. Add the correct arrow class (asc or desc)
        if (col === currentSortColumn) {
            arrow.classList.add(currentSortDirection);
        }
    });
}

function renderGolfers(golfers) {
    const tbody = document.querySelector("#golfer-table tbody");
    tbody.innerHTML = "";

    golfers.forEach(g => {
        const tr = document.createElement("tr");

        tr.innerHTML = `
            <td>${g.last_name}</td>
            <td>${g.first_name}</td>
            <td>${g.email}</td>
            <td>${g.is_admin ? "Yes" : "No"}</td>
            <td>${g.is_member ? "Yes" : "No"}</td>
            <td>${g.subgroup}</td>
            <td>${g.subgroup_number}</td>
            <td class="actions-cell">
                <button class="btn btn-small" onclick="openEditModal(${g.id})">✏️ Edit</button>
                <button class="btn btn-danger btn-small" onclick="deleteGolfer(${g.id})">🗑️ Delete</button>
                <button class="btn btn-small" 
                        onclick="openResetPasswordModal(${g.id}, '${g.first_name}', '${g.last_name}')">
                      🔑 Reset
               </button>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

async function loadGolfers() {
    const res = await fetch("/admin/golfers/api", { credentials: "include" });
    const golfers = await res.json();

    window.currentGolfers = golfers;   // store globally

    console.log("GOLFERS RESPONSE:", golfers);

    renderGolfers(golfers);            // use new renderer
}

function openCreateModal() {
  // Clear all fields
  document.getElementById("first-name").value = "";
  document.getElementById("last-name").value = "";
  document.getElementById("email").value = "";
  document.getElementById("password").value = "";
  document.getElementById("subgroup").value = "";
  document.getElementById("subgroup-number").value = "";
  document.getElementById("is-admin").checked = false;
  document.getElementById("is-member").checked = false;

  // Show modal
  document.getElementById("create-modal").style.display = "flex";
}

function closeCreateModal() {
    document.getElementById("create-modal").style.display = "none";
}

async function createGolfer() {
    const first_name = document.getElementById("first-name").value.trim();
    const last_name = document.getElementById("last-name").value.trim();
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const subgroup = document.getElementById("subgroup").value.trim();
    const subgroup_number = document.getElementById("subgroup-number").value.trim();
    const is_admin = document.getElementById("is-admin").checked;
    const is_member = document.getElementById("is-member").checked;

    // Basic validation
    if (!first_name || !last_name || !email || !password) {
        alert("First name, last name, email, and password are required.");
        return;
    }

    const res = await fetch("/admin/golfers/api", {
        method: "POST",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            first_name,
            last_name,
            email,
            password,
            subgroup,
            subgroup_number,
            is_admin,
            is_member
        })
    });

    // Handle non-200 responses
    if (!res.ok) {
        const text = await res.text();
        alert("Server error: " + text);
        return;
    }

    const data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    // Success!
    closeCreateModal();
    loadGolfers();
}

let editGolferId = null;

function openEditModal(id) {
    editGolferId = id;

    // Find golfer in current table data
    const golfer = window.currentGolfers.find(g => g.id === id);

    document.getElementById("edit-first-name").value = golfer.first_name;
    document.getElementById("edit-last-name").value = golfer.last_name;
    document.getElementById("edit-email").value = golfer.email;

    document.getElementById("edit-subgroup").value = golfer.subgroup || "";
    document.getElementById("edit-subgroup-number").value = golfer.subgroup_number || "";

    document.getElementById("edit-is-admin").checked = golfer.is_admin;
    document.getElementById("edit-is-member").checked = golfer.is_member;

    document.getElementById("edit-modal").style.display = "flex";
}

async function saveGolferEdits() {
    const first_name = document.getElementById("edit-first-name").value.trim();
    const last_name = document.getElementById("edit-last-name").value.trim();
    const email = document.getElementById("edit-email").value.trim();
    const subgroup = document.getElementById("edit-subgroup").value.trim();
    const subgroup_number = document.getElementById("edit-subgroup-number").value.trim();
    const is_admin = document.getElementById("edit-is-admin").checked;
    const is_member = document.getElementById("edit-is-member").checked;

    const res = await fetch(`/admin/golfers/api/${editGolferId}`, {
        method: "PUT",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            first_name,
            last_name,
            email,
            subgroup,
            subgroup_number,
            is_admin,
            is_member
        })
    });

    const data = await res.json();

    if (data.error) {
        //hideSpinner();
        alert(data.error);
        return;
    }

    closeEditModal();
    loadGolfers();
    //hideSpinner();
}

async function deleteGolfer(id) {
    if (!confirm("Are you sure you want to delete this golfer?")) {
        return;
    }

    const res = await fetch(`/admin/golfers/api/${id}`, {
        method: "DELETE",
        credentials: "include"
    });

    const data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    loadGolfers();
}

async function savePasswordReset() {
    const pw = document.getElementById("reset-password").value.trim();
    const pw2 = document.getElementById("reset-password-confirm").value.trim();

    if (!pw || !pw2) {
        alert("Please enter and confirm the new password.");
        return;
    }

    if (pw !== pw2) {
        alert("Passwords do not match.");
        return;
    }

    const res = await fetch(`/admin/golfers/api/${resetPasswordGolferId}/password`, {
        method: "PUT",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw })
    });

    const data = await res.json();

    if (data.error) {
        alert(data.error);
        return;
    }

    closeResetPasswordModal();
    alert(`Password updated successfully for ${resetPasswordFirstName} ${resetPasswordLastName}.`);

}

function closeEditModal() {
    document.getElementById("edit-modal").style.display = "none";
}

let resetPasswordGolferId = null;

function openResetPasswordModal(id, first_name, last_name) {
    resetPasswordGolferId = id;
    resetPasswordFirstName = first_name;
    resetPasswordLastName = last_name;

    document.getElementById("reset-password").value = "";
    document.getElementById("reset-password-confirm").value = "";
    document.getElementById("reset-password-modal").style.display = "flex";
}

function closeResetPasswordModal() {
    document.getElementById("reset-password-modal").style.display = "none";
}
async function initPage() {
    try {
        await loadNav();                     // now exists
        const session = await loadSession();
        await loadAdminIdentity(session);
        await loadGolfers();
    } catch (err) {
        console.error("Page initialization error:", err);
    }
}

document.addEventListener("DOMContentLoaded", initPage);

</script>

<div id="loadingOverlay">
  <div class="spinner"></div>
</div>

</body>
</html>

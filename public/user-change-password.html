<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Password</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/css/navbar.css">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 420px;
            margin: 60px auto;
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        h2 {
            margin-top: 0;
            text-align: center;
            font-size: 22px;
        }

        label {
            display: block;
            margin-top: 14px;
            font-weight: bold;
            font-size: 14px;
        }

        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .btn {
            width: 100%;
            margin-top: 20px;
            padding: 12px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        .btn:hover {
            background: #2980b9;
        }

        .banner {
            display: none;
            margin-top: 16px;
            padding: 12px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }

        .banner.success {
            background: #d4edda;
            color: #155724;
        }

        .banner.error {
            background: #f8d7da;
            color: #721c24;
        }

        .back-link {
            display: block;
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div id="user-nav-container"></div>

<script>
document.addEventListener("DOMContentLoaded", async () => {
  const html = await fetch("/partials/user-nav.html").then(r => r.text());
  document.getElementById("user-nav-container").innerHTML = html;
});
</script>


<div class="container">
    <h2>Change Password</h2>

    <label>Current Password</label>
    <input type="password" id="current-password">

    <label>New Password</label>
    <input type="password" id="new-password">

    <label>Confirm New Password</label>
    <input type="password" id="confirm-password">

    <button class="btn" onclick="changePassword()">Save Password</button>

    <div id="banner" class="banner"></div>

    <a href="/schedule" class="back-link">← Back to Schedule</a>
</div>

<script>
async function changePassword() {
    const current = document.getElementById("current-password").value.trim();
    const pw = document.getElementById("new-password").value.trim();
    const pw2 = document.getElementById("confirm-password").value.trim();
    const banner = document.getElementById("banner");

    banner.style.display = "none";

    if (!current || !pw || !pw2) {
        showBanner("All fields are required.", "error");
        return;
    }

    if (pw !== pw2) {
        showBanner("New passwords do not match.", "error");
        return;
    }

    const res = await fetch("/user/change-password", {
        method: "PUT",
        credentials: "include",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            current_password: current,
            new_password: pw
        })
    });

    const data = await res.json();

    if (data.error) {
        showBanner(data.error, "error");
        return;
    }

    showBanner("Password updated successfully!", "success");

    // Optional: clear fields
    document.getElementById("current-password").value = "";
    document.getElementById("new-password").value = "";
    document.getElementById("confirm-password").value = "";
}

function showBanner(msg, type) {
    const banner = document.getElementById("banner");
    banner.textContent = msg;
    banner.className = "banner " + type;
    banner.style.display = "block";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Two-Week Golfers Report</title>
  <link rel="stylesheet" href="/css/admin-nav.css">
  <link rel="stylesheet" href="/css/admin-identity.css">

  <style>

    /* ------------------------------
       MODAL OVERLAY
    --------------------------------*/
    .modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
    }

    .modal.hidden {
      display: none;
    }

    .modal-content {
      background: white;
      padding: 25px;
      border-radius: 8px;
      width: 420px;
      box-shadow: 0 0 12px rgba(0,0,0,0.2);
    }

    .recipient-section label {
      display: block;
      margin: 8px 0;
      font-size: 1rem;
    }

    .modal-buttons {
      margin-top: 20px;
      text-align: right;
    }

    .modal-buttons button {
      margin-left: 10px;
    }

    /* ------------------------------
       REPORT LAYOUT
    --------------------------------*/
    .report-container {
      margin: 30px;
    }

    .controls {
      margin-top: 20px;
    }

    .controls button {
      margin-right: 10px;
      padding: 8px 14px;
      font-size: 14px;
    }

    /* ------------------------------
       SLIM TABLE
    --------------------------------*/

    #report-table-container {
      display: flex;
      justify-content: center;
    }

    .report-table {
      width: auto;
      max-width: 900px;
      margin: 0 auto;
      border-collapse: collapse;
      table-layout: fixed;
      font-size: 0.9rem;
    }

    .report-table th,
    .report-table td {
      padding: 4px 6px;
      border: 1px solid #ccc;
      word-wrap: break-word;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .report-table th {
      background: #f4f4f4;
      font-weight: bold;
    }

    .report-header {
      text-align: center;
      margin-bottom: 10px;
      padding-bottom: 6px;
      border-bottom: 1px solid #ccc;
    }

    .report-header h1 {
      margin-bottom: 12px;
    }

    .report-buttons {
      display: inline-flex;
      gap: 12px;
    }

    .totals-row td {
      background: #fafafa;
      font-weight: bold;
    }

    /* ------------------------------
       PRINT VERSION
    --------------------------------*/
    @media print {
      .report-table {
        max-width: 100%;
      }
      .report-table th,
      .report-table td {
        padding: 3px 4px;
        font-size: 0.8rem;
      }
    }

  </style>

  <script defer src="/js/admin-two-week-report.js"></script>
</head>
<body>

  <!-- Load Admin Nav -->
  <div id="nav-container"></div>
  <script>
    fetch("/partials/admin-nav.html")
      .then(r => r.text())
      .then(html => document.getElementById("nav-container").innerHTML = html);
  </script>

  <div class="report-container">
    <div class="report-header">
      <h1>Two-Week Golfers Report</h1>

      <div class="report-buttons">
        <button id="btnEmailReport">Send Report</button>
        <button onclick="window.print()">Print Report</button>
      </div>
    </div>

    <div id="report-table-container">
      <!-- JS injects the table here -->
    </div>
  </div>

  <!-- SEND REPORT MODAL -->
  <div id="sendReportModal" class="modal hidden">
    <div class="modal-content">

      <h2>Send Two‑Week Report</h2>

      <div class="recipient-section">

        <label>
          <input type="checkbox" id="chkSelectAll">
          Select All
        </label>

        <label>
          <input type="checkbox" id="chkPlayers">
          Players in this report
        </label>

        <label>
          <input type="checkbox" id="chkAdmins">
          League admins
        </label>

        <label>
          <input type="checkbox" id="chkStaff">
          Club staff
        </label>

        <label>
          <input type="checkbox" id="chkSelf" checked disabled>
          Me (always included)
        </label>

        <label>
          <input type="checkbox" id="chkSelfOnly">
          Send to Myself Only
        </label>

      </div>

      <div class="modal-buttons">
        <button id="btnSendReport" class="primary">SEND</button>
        <button id="btnCancelSend" class="secondary">CANCEL</button>
      </div>

    </div>
  </div>

</body>
</html>

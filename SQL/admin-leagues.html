<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>League Management</title>
  <link rel="stylesheet" href="/styles.css">

  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    h1 { margin-bottom: 20px; }

    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #ccc;
      text-align: left;
    }

    tr:hover { background: #f5f5f5; }

    .form-section {
      margin-top: 30px;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fafafa;
    }

    .form-row {
      margin-bottom: 10px;
    }

    label {
      display: inline-block;
      width: 180px;
      font-weight: bold;
    }

    input[type="text"] {
      padding: 6px;
      width: 250px;
    }

    button {
      padding: 8px 14px;
      margin-right: 10px;
      cursor: pointer;
    }

    .edit-btn { background: #4CAF50; color: white; }
    .delete-btn { background: #d9534f; color: white; }
    .save-btn { background: #0275d8; color: white; }
  </style>
</head>

<body>

  <!-- ADMIN NAV BAR -->
  <div id="admin-nav"></div>
  <script src="/admin-nav.js"></script>

  <h1>League Management</h1>

  <!-- TABLE OF LEAGUES -->
  <table id="leagueTable">
    <thead>
      <tr>
        <th>ID</th>
        <th>League Name</th>
        <th>Coordinator Last</th>
        <th>Coordinator First</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <!-- ADD LEAGUE FORM -->
  <div class="form-section">
    <h2>Add New League</h2>

    <div class="form-row">
      <label>League Name:</label>
      <input type="text" id="newLeagueName">
    </div>

    <div class="form-row">
      <label>Coordinator Last Name:</label>
      <input type="text" id="newCoordLast">
    </div>

    <div class="form-row">
      <label>Coordinator First Name:</label>
      <input type="text" id="newCoordFirst">
    </div>

    <button class="save-btn" onclick="addLeague()">Add League</button>
  </div>

  <!-- EDIT LEAGUE MODAL -->
  <div id="editModal" style="
      display:none; 
      position:fixed; 
      top:0; left:0; right:0; bottom:0; 
      background:rgba(0,0,0,0.5); 
      justify-content:center; 
      align-items:center;
    ">
    <div style="background:white; padding:20px; border-radius:6px; width:400px;">
      <h2>Edit League</h2>

      <input type="hidden" id="editLeagueId">

      <div class="form-row">
        <label>League Name:</label>
        <input type="text" id="editLeagueName">
      </div>

      <div class="form-row">
        <label>Coordinator Last Name:</label>
        <input type="text" id="editCoordLast">
      </div>

      <div class="form-row">
        <label>Coordinator First Name:</label>
        <input type="text" id="editCoordFirst">
      </div>

      <button class="save-btn" onclick="saveLeague()">Save</button>
      <button onclick="closeEdit()">Cancel</button>
    </div>
  </div>

  <script>
    // Load leagues on page load
    document.addEventListener("DOMContentLoaded", loadLeagues);

    function loadLeagues() {
      fetch('/api/leagues')
        .then(res => res.json())
        .then(data => {
          const tbody = document.querySelector("#leagueTable tbody");
          tbody.innerHTML = "";

          data.forEach(league => {
            const tr = document.createElement("tr");

            tr.innerHTML = `
              <td>${league.id}</td>
              <td>${league.league_name}</td>
              <td>${league.coordinator_last_name || ""}</td>
              <td>${league.coordinator_first_name || ""}</td>
              <td>
                <button class="edit-btn" onclick="openEdit(${league.id})">Edit</button>
                <button class="delete-btn" onclick="deleteLeague(${league.id})">Delete</button>
              </td>
            `;

            tbody.appendChild(tr);
          });
        });
    }

    function addLeague() {
      const league_name = document.getElementById("newLeagueName").value.trim();
      const coordinator_last_name = document.getElementById("newCoordLast").value.trim();
      const coordinator_first_name = document.getElementById("newCoordFirst").value.trim();

      fetch('/api/leagues', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ league_name, coordinator_last_name, coordinator_first_name })
      })
      .then(res => res.json())
      .then(() => {
        loadLeagues();
        document.getElementById("newLeagueName").value = "";
        document.getElementById("newCoordLast").value = "";
        document.getElementById("newCoordFirst").value = "";
      });
    }

    function openEdit(id) {
      fetch(`/api/leagues/${id}`)
        .then(res => res.json())
        .then(league => {
          document.getElementById("editLeagueId").value = league.id;
          document.getElementById("editLeagueName").value = league.league_name;
          document.getElementById("editCoordLast").value = league.coordinator_last_name || "";
          document.getElementById("editCoordFirst").value = league.coordinator_first_name || "";

          document.getElementById("editModal").style.display = "flex";
        });
    }

    function closeEdit() {
      document.getElementById("editModal").style.display = "none";
    }

    function saveLeague() {
      const id = document.getElementById("editLeagueId").value;
      const league_name = document.getElementById("editLeagueName").value.trim();
      const coordinator_last_name = document.getElementById("editCoordLast").value.trim();
      const coordinator_first_name = document.getElementById("editCoordFirst").value.trim();

      fetch(`/api/leagues/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ league_name, coordinator_last_name, coordinator_first_name })
      })
      .then(res => res.json())
      .then(() => {
        closeEdit();
        loadLeagues();
      });
    }

    function deleteLeague(id) {
      if (!confirm("Are you sure you want to delete this league?")) return;

      fetch(`/api/leagues/${id}`, { method: 'DELETE' })
        .then(res => res.json())
        .then(() => loadLeagues());
    }
  </script>

</body>
</html>

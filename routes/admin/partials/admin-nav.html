<div id="topNav">
  <div class="nav-title">
    Admin Panel
    <span id="adminLeagueName"></span>
    <span id="adminUserName"></span>
  </div>

  <div class="nav-links">
    <a href="/admin" class="nav-link">Dashboard</a>
    <a href="/admin-users" class="nav-link">Golfers</a>
    <a href="/admin-leagues" class="nav-link">Leagues</a>
    <a href="/admin-play-months" class="nav-link">Play Months</a>
    <a href="/admin-play-days" class="nav-link">Play Days</a>
    <a href="/logout" class="nav-link">Logout</a>
  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  // Load league name
  fetch("/api/user/selected-league")
    .then(r => r.json())
    .then(data => {
      if (data.league) {
        document.getElementById("adminLeagueName").textContent =
          " — " + data.league.league_name;
      }
    });

  // Load admin name
  fetch("/api/user/info")
    .then(r => r.json())
    .then(data => {
      if (data.user) {
        document.getElementById("adminUserName").textContent =
          " — " + data.user.first_name + " " + data.user.last_name;
      }
    });
});
</script>
